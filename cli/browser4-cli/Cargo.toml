[package]
name = "browser4-cli"
version = "4.16.2"
edition = "2021"
autotests = false
description = "Browser4 CLI — control a Browser4 server from the command line"
authors = ["Platon AI <ivincent.zhang@gmail.com>"]
license = "Apache-2.0"

[[bin]]
name = "browser4-cli"
path = "src/main.rs"

[lib]
name = "browser4_cli"
path = "src/lib.rs"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"
harness = false

[dependencies]
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.13.1", features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
dirs = "6.0.0"
base64 = "0.22"
chrono = "0.4"
regex = { version = "1.5.5" }
urlencoding = "2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
# 9.0.5 is the first release that fixes the zip-cloaking parser differential
# (GHSA-m665-v7pm-7grj) and the unbounded-symlink-target exhaustion
# (GHSA-q7v9-x93c-xqv3) — both reachable from a downloaded runtime bundle.
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
