[package]
name = "browser4-cli"
version = "0.1.25"
edition = "2021"
autotests = false
description = "Browser4 CLI — control a Browser4 server from the command line"
authors = ["Platon AI <ivincent.zhang@gmail.com>"]
license = "Apache-2.0"

[[bin]]
name = "browser4-cli"
path = "src/main.rs"

[lib]
name = "browser4_cli"
path = "src/lib.rs"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"
harness = false

[dependencies]
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.13.1", features = ["macros", "rt", "rt-multi-thread", "signal", "time"] }
dirs = "6.0.0"
base64 = "0.22"
chrono = "0.4"
regex = { version = "1.5.5" }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
