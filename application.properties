## CAPTCHA Solving Configuration
## Store API keys in application-private.properties, never in version control!

# Enable automatic CAPTCHA detection and solving during browsing
captcha.auto.solve.enabled=true

# Primary solving service: CAPSOLVER, TWO_CAPTCHA, ANTI_CAPTCHA
captcha.service.provider=CAPSOLVER

# API keys — set as environment variables or in application-private.properties
# captcha.capsolver.api.key=${CAPSOLVER_KEY}
# captcha.twocaptcha.api.key=${TWOCAPTCHA_KEY}
# captcha.anticaptcha.api.key=${ANTICAPTCHA_KEY}

# Maximum time to wait for a solution (seconds)
captcha.solve.timeout.seconds=120

# Interval between polling for task status (ms)
captcha.poll.interval.ms=1000

# Proxy for solver traffic (optional, leave empty for direct)
# captcha.solve.proxy=

# Enable automatic CAPTCHA detection on page load
captcha.detection.enabled=true

# Types of CAPTCHA to auto-solve: RECAPTCHA_V2,RECAPTCHA_V2_INVISIBLE,RECAPTCHA_V3,HCAPTCHA,TURNSTILE,IMAGE,FUNCAPTCHA,ALL
captcha.auto.solve.types=RECAPTCHA_V2,HCAPTCHA,TURNSTILE

# Report failed solves for refund (2Captcha / Anti-Captcha only)
captcha.report.failed.enabled=true

# Maximum retry attempts for solving
captcha.solve.max.retries=3

# each time the rotation URL is accessed, it should return a response containing one or more fresh proxy IPs in any format.
# proxy.rotation.url=https://your-proxy-provider.com/rotation-endpoint

# Chromium/Chrome/Edge extension
# This is a PLACEHOLDER — the real token is generated per-browser by the extension
# and stored in the browser's localStorage under key "auth-token".  To find yours:
#   1. Open chrome-extension://fcagfeimnhdkkkkipkjjolahpakoddeb/connect.html in Chrome
#   2. The token is displayed in the "Authentication Token" section as:
#      BROWSER4_EXTENSION_TOKEN=<your-real-token>
#   3. Copy that value and set it as an OS environment variable (not here).
#      The CLI reads the env var, not this file — the backend never reads it at all.
# This placeholder is never used at runtime; it only documents the var name.
BROWSER4_EXTENSION_TOKEN=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
