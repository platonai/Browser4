spring.main.allow-bean-definition-overriding=true

# =============================================================================
# Browser4 Application Configuration
# =============================================================================
# This file documents ALL environment variables recognized by Browser4.
# Values below are PLACEHOLDERS and commented out by default.
# The CLI and backend read these from the OS environment, not from this file —
# this file serves as documentation and a local reference.
#
# To manage env vars interactively, use the helper scripts:
#   bash:   ./bin/env-manage.sh show|get|set|unset|export|list
#   pwsh:   .\bin\env-manage.ps1 show|get|set|unset|export|list
# =============================================================================

# ---------------------------------------------------------------------------
# CLI: Runtime & Paths
# ---------------------------------------------------------------------------

# Chrome extension auth token for auto-approval of attach requests.
# Find yours at: chrome-extension://.../connect.html → "Authentication Token" section
# The CLI reads this from the OS environment, not from this file.
# BROWSER4_EXTENSION_TOKEN=<your-real-token>

# Default session ID for the CLI (pre-selects a session so you don't need --session on every command)
# BROWSER4_CLI_SESSION=default

# Override CLI session state directory (default: ~/.browser4 on Linux/macOS, %APPDATA%/browser4 on Windows)
# BROWSER4_CLI_STATE_DIR=/custom/path/to/state

# Override runtime bundle & download cache directory
# BROWSER4_RUNTIME_DIR=/custom/path/to/runtime

# Override skills directory path (default: versioned install dir under RUNTIME_DIR)
# BROWSER4_SKILLS_DIR=/custom/path/to/skills

# Custom Chromium/Chrome browser executable path (auto-detected if unset)
# BROWSER4_BROWSER_PATH=/usr/bin/google-chrome

# ── Browser channels (Chrome/Edge/Brave/Ego …) ──────────────────────────────
#
# Browser4 uses CDP to drive any Chromium-kernel browser. Which browser the
# CLI picks per-session is controlled by `browser.channel` (values like
# "chrome", "edge", "ego-lite"). Each channel can be declared here so no
# Kotlin code is required to wire a new browser — just edit this file.
#
# Leave browser.channels UNSET to fall back to the two built-in resolvers
# (default Chrome + ego lite). Set it to a comma-separated list and declare
# a `browser.channel.<name>.*` block for every entry.
#
# Placeholder syntax ${NAME} expands to a config value, JVM system property or
# environment variable (with ${NAME:-default} fallback).
#
# #browser.channels=chrome, edge, brave, ego-lite
#
# # --- Chrome (built-in default, shown here as reference) -------------------
# #browser.channel.chrome.aliases=chrome, google-chrome, google chrome
# #browser.channel.chrome.stealth.injectable=true
# #browser.channel.chrome.binary.path=                          # empty → Browsers.searchChromeBinary()
# #browser.channel.chrome.binary.install-dirs=
# #browser.channel.chrome.post-launch.action=none
#
# # --- Microsoft Edge ------------------------------------------------------
# #browser.channel.edge.aliases=edge, msedge, microsoft-edge
# #browser.channel.edge.stealth.injectable=true
# #browser.channel.edge.binary.path=
# #browser.channel.edge.binary.install-dirs=${ProgramFiles}\Microsoft\Edge\Application\msedge.exe, ${ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe, ${LOCALAPPDATA}\Microsoft\Edge\Application\msedge.exe
# #browser.channel.edge.post-launch.action=none
#
# # --- Brave Browser -------------------------------------------------------
# #browser.channel.brave.aliases=brave, brave-browser
# #browser.channel.brave.stealth.injectable=true
# #browser.channel.brave.binary.path=
# #browser.channel.brave.binary.install-dirs=${ProgramFiles}\BraveSoftware\Brave-Browser\Application\brave.exe, ${LOCALAPPDATA}\BraveSoftware\Brave-Browser\Application\brave.exe
# #browser.channel.brave.post-launch.action=none
#
# # --- Ego Lite (fingerprint browser, stealth off) -------------------------
# #browser.channel.ego-lite.aliases=ego-lite, egolite, ego lite, ego
# #browser.channel.ego-lite.stealth.injectable=false
# #browser.channel.ego-lite.binary.path=${ego.path}              # session-level override
# #browser.channel.ego-lite.binary.install-dirs=${ProgramFiles}\Citro Labs\ego lite\Application\ego.exe, ${ProgramFiles(x86)}\Citro Labs\ego lite\Application\ego.exe, ${LOCALAPPDATA}\Citro Labs\ego lite\Application\ego.exe
# #browser.channel.ego-lite.post-launch.action=webrtc_policy
# #browser.channel.ego-lite.post-launch.webrtc.policy=disable_non_proxied_udp

# JVM options injected into backend server launch, space-separated
# BROWSER4_SERVER_OPTS=-Dapp.name=browser4 -Xmx2g

# ── Backend: Data directory relocation (4.17+) ────────────────────────────
#
# Browser4's data root defaults to ~/.browser4/ and contains Chrome profiles,
# WebDB/H2, crawl checkpoints, agent task logs, knowledge store and logs.
# Every path under it is resolved by DataDirResolver.
#
# Property priority (first set wins):
#   1. browser4.data.root   (canonical root — 4.17+)
#   2. app.data.dir         (AppContext — also a root)
#   3. browser4.data.dir    (legacy — treated as parent of .browser4/)
#   4. Default: ~/.browser4
#
# Move the ENTIRE data tree onto another disk in one shot:
# BROWSER4_SERVER_OPTS=-Dbrowser4.data.root=D:/Browser4-Data
#
# Move only large sub-systems independently (keep the rest on the default root):
# BROWSER4_SERVER_OPTS=-Dbrowser4.data.crawl.dir=E:/BigDisk/crawl
# BROWSER4_SERVER_OPTS=-Dbrowser4.data.logs.dir=F:/SSD/logs
#
# All relocation properties:
# -Dbrowser4.data.root=<path>           # Whole data tree
# -Dbrowser4.data.crawl.dir=<path>       # Crawl tasks + checkpoints (~/.browser4/data/crawl/)
# -Dbrowser4.data.agent.dir=<path>       # Agent tasks + event logs (~/.browser4/data/agent/)
# -Dbrowser4.data.swarm.dir=<path>       # Swarm task responses (~/.browser4/data/swarm/)
# -Dbrowser4.data.knowledge.dir=<path>    # Knowledge store PEM (~/.browser4/knowledge/)
# -Dbrowser4.data.logs.dir=<path>        # Rolling app logs (~/.browser4/logs/)
#
# Backward-compatible legacy properties still work:
# -Dapp.data.dir=<path>                  # AppContext-style root (unchanged)
# -Dbrowser4.data.dir=<path>             # Legacy parent-of-.browser4 scheme (unchanged)
# -Dknowledge.dir=<path>                 # Knowledge store absolute path (unchanged)

# MCP-over-HTTP endpoint (opt-in; OFF by default). Enabling it binds a second
# endpoint (POST /mcp, default port 8088) and eagerly acquires a browser session
# at backend start, so it is only worth turning on for an MCP client such as
# Claude Desktop or Cursor. Pass it through the JVM options above, e.g.:
# BROWSER4_SERVER_OPTS=-Dmcp.http.enabled=true -Dmcp.http.port=8088
# mcp.http.enabled=true
# mcp.http.port=8088

# Directory for server startup logs (default: RUNTIME_DIR/logs)
# BROWSER4_SERVER_LOG_DIR=/path/to/logs

# ---------------------------------------------------------------------------
# CLI: Download & Mirror
# ---------------------------------------------------------------------------

# Override releases download base URL (default: GitHub Releases)
# BROWSER4_RELEASES_BASE_URL=https://mirrors.example.com/browser4/releases

# Override mirror configuration file path (default: runtime/mirrors.json)
# BROWSER4_MIRRORS_CONFIG=/path/to/custom-mirrors.json

# Mirror reachability check timeout in seconds (default: 5)
# BROWSER4_CLI_MIRROR_CHECK_TIMEOUT_SECS=10

# Per-mirror speed test download timeout in seconds (default: 30)
# BROWSER4_CLI_MIRROR_SPEED_TEST_TIMEOUT_SECS=15

# Cached mirror preference TTL in seconds (default: 86400 = 24 hours)
# BROWSER4_CLI_MIRROR_PREFERENCE_TTL_SECS=3600

# Download timeout in seconds (default: 1800 = 30 minutes)
# BROWSER4_CLI_DOWNLOAD_TIMEOUT_SECS=600

# Set to 1 to disable speed testing (falls back to TCP-only reachability)
# BROWSER4_CLI_DISABLE_MIRROR_SPEED_TEST=1

# Root search start directory for resolving relative paths (default: current working directory)
# BROWSER4_CLI_INVOKE_DIR=/home/user/projects

# ---------------------------------------------------------------------------
# CLI: Build & Bundle
# ---------------------------------------------------------------------------

# Set to 1/true/yes/on to force download from remote releases instead of local build
# BROWSER4_CLI_FORCE_REMOTE_BUNDLE=1

# Set to 1/true/yes/on to force rebuild runtime bundle from source
# BROWSER4_CLI_FORCE_REBUILD_BUNDLE=1

# ---------------------------------------------------------------------------
# CLI: HTTP Request Timeouts (seconds)
# ---------------------------------------------------------------------------

# Default HTTP request timeout (default: 30)
# BROWSER4_CLI_HTTP_TIMEOUT_SECS=60

# Navigation (page load) request timeout (default: 120)
# BROWSER4_CLI_NAVIGATION_TIMEOUT_SECS=180

# Text input request timeout (default: 90)
# BROWSER4_CLI_INPUT_TIMEOUT_SECS=120

# Snapshot request timeout (default: 60)
# BROWSER4_CLI_SNAPSHOT_TIMEOUT_SECS=90

# Agent tool request timeout (default: 180)
# BROWSER4_CLI_AGENT_TIMEOUT_SECS=300

# Act tool request timeout (default: 60)
# BROWSER4_CLI_ACT_TIMEOUT_SECS=120

# Crawl request timeout (default: 600)
# BROWSER4_CLI_CRAWL_TIMEOUT_SECS=1200

# ---------------------------------------------------------------------------
# CLI: Proxy
# ---------------------------------------------------------------------------

# Explicit CLI download proxy URL (also set by --proxy <url> on the CLI)
# BROWSER4_CLI_PROXY=http://proxy:8080

# Internal test flag (ignore)
# BROWSER4_CLI_TEST_TEMPORARY_PROFILE=0

# ---------------------------------------------------------------------------
# LLM / AI Provider API Keys
# ---------------------------------------------------------------------------
# Set ONE of these depending on which LLM provider you use.
# Priority order (in AgentToolExecutor): LLM_API_KEY → DEEPSEEK_API_KEY →
#   OPENROUTER_API_KEY → VOLCENGINE_API_KEY → OPENAI_API_KEY
#
# IMPORTANT: env-style keys (DEEPSEEK_API_KEY=...) below are only honored as
# REAL environment variables or -D system properties.  Inside a `.properties`
# file (including ~/.browser4/config/conf-enabled/*.properties) they do NOT
# bind to the engine's dotted lookups (deepseek.api.key) and extract/summarize
# would fail with "LLM API key is not configured".  At startup the backend
# automatically rewrites env-style LLM keys found in conf-enabled properties
# files to their dotted form (DEEPSEEK_API_KEY=... → deepseek.api.key=...),
# but the recommended file format is the dotted keys in the provider sections
# below.

# Generic LLM API key (fallback for all providers)
# LLM_API_KEY=sk-...

# OpenAI (env-var style; only valid as an environment variable)
# OPENAI_API_KEY=sk-...

# OpenRouter (env-var style; only valid as an environment variable)
# OPENROUTER_API_KEY=sk-or-v1-...

# DeepSeek (env-var style; only valid as an environment variable)
# DEEPSEEK_API_KEY=sk-...

# Volcengine (env-var style; only valid as an environment variable)
# VOLCENGINE_API_KEY=...

# Provider-specific Spring properties (uncomment the provider you want to use):

## OpenRouter
#openrouter.api.key=...
#openrouter.model.name=openai/gpt-6.1-sol
#openrouter.base.url=https://openrouter.ai/api/v1/

## Volcengine (ByteDance)
# volcengine.api.key=...
# volcengine.model.name=doubao-seed-2-1-pro-260915
# volcengine.base.url=https://ark.cn-beijing.volces.com/api/v3

## DeepSeek
# deepseek.api.key=sk-...
# deepseek.model.name=deepseek-flash
# deepseek.base.url=https://api.deepseek.com

# Per-request input length cap for the LLM chat model. PulsarRPA's
# ChatModelSettings defaults to 64_000 (a conservative floor across all
# providers) and silently truncates messages above it; deepseek-flash
# supports a 1M-token context window, so raise the cap to match and leave
# headroom for output tokens.
llm.max.input.token.length=900000

## OpenAI-compatible
# openai.api.key=sk-...
# openai.model.name=gpt-6.1-sol
# openai.base.url=https://api.openai.com/v1

## Aliyun Qwen (DashScope, OpenAI-compatible)
# openai.api.key=sk-...
# openai.model.name=qwen-plus
# openai.base.url=https://dashscope.aliyuncs.com/compatible-mode/v1

# ---------------------------------------------------------------------------
# CAPTCHA Solving
# ---------------------------------------------------------------------------

# Enable automatic CAPTCHA detection and solving during browsing
# captcha.auto.solve.enabled=true

# Primary solving service: CAPSOLVER, TWO_CAPTCHA, ANTI_CAPTCHA
# captcha.service.provider=CAPSOLVER

# API keys — set as environment variables (preferred) or in application-private.properties
# captcha.capsolver.api.key=${CAPSOLVER_KEY}
# captcha.twocaptcha.api.key=${TWOCAPTCHA_KEY}
# captcha.anticaptcha.api.key=${ANTICAPTCHA_KEY}

# CAPSOLVER_KEY=<your-capsolver-key>
# TWOCAPTCHA_KEY=<your-2captcha-key>
# ANTICAPTCHA_KEY=<your-anticaptcha-key>

# Maximum time to wait for a solution (seconds)
# captcha.solve.timeout.seconds=120

# Interval between polling for task status (ms)
# captcha.poll.interval.ms=1000

# Enable automatic CAPTCHA detection on page load
# captcha.detection.enabled=true

# Types of CAPTCHA to auto-solve
# captcha.auto.solve.types=RECAPTCHA_V2,HCAPTCHA,TURNSTILE

# Report failed solves for refund (2Captcha / Anti-Captcha only)
# captcha.report.failed.enabled=true

# Maximum retry attempts for solving
# captcha.solve.max.retries=3

