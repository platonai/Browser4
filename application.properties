# ── Agent feedback-loop overhaul (2026-08-21) ──────────────────────────────
# Native tool calling is the DEFAULT now; tool results feed back into the
# conversation automatically. Explicit fallbacks: `text`, `chat`.
# agent.tool.expose.mode=toolCalling
# Tiered task-adaptive tool disclosure: `tiered` (default) or `full` (flat list).
# browser4.agent.toolDisclosure=tiered
# Abort after N consecutive text-only responses (0 = disabled).
# browser4.agent.textOnlyStallLimit=5
# Finish-report gate validation: `strict` (default) or `warn`.
# browser4.agent.finishGateCheck=strict
# Files the run wrote but the report omitted (rule 7): `amend` (default — the
# model gets the missing list back for up to browser4.agent.repair.maxRounds
# rounds, then filesChanged is completed from the run's mutation trace and the
# task stays successful) or `reject` (fail the task).
# browser4.agent.finish.unlistedFiles=amend
# Max model<->tool round-trips inside one native tool-calling turn.
# browser4.agent.toolLoop.maxIterations=12
# ── Auto skill summary (post-success side effect) ──────────────────────────
# NOTE: these keys are read from JVM system properties (-D) or environment
# variables only. The lines below are the documented defaults; editing them in
# this file has no effect.
# After a task passes the finish gate, summarize what it did into a reusable
# SKILL.md draft. Off by default; turn on only where you want reuse assets.
# browser4.agent.skill.summary.enabled=false
# Registration strategy: `draft` (default — write draft only, do not register),
# `auto` (register after validation passes), `off`.
# browser4.agent.skill.summary.registerMode=draft
# Minimum agent rounds / tool calls before a run is worth summarizing.
# Browse tasks finish in a single round no matter how many tools they call,
# so the work bar is carried by minToolCalls, not by the round count.
# browser4.agent.skill.summary.minRounds=1
# browser4.agent.skill.summary.minToolCalls=5
# Whether a run WITHOUT file mutations (browse/research) must pass the reuse
# score below. On by default; runs that did change files skip this bar.
# Set false to let every no-mutation run generate a draft (debug only).
# browser4.agent.skill.summary.browseScoreGate=true
# Reuse score for runs without file mutations:
# toolKinds + 3 * strategySwitches - 2 * verbatimRetries. A strategy switch is a
# failed call followed later by a successful different approach; a verbatim retry
# is the same tool with identical arguments. A single-pass simple run scores low
# and is skipped, a run that corrected itself scores high.
# browser4.agent.skill.summary.browseMinScore=6
# Dedup similarity threshold (0.0..1.0); a run above it appends to an existing
# skill instead of creating a new one.
# browser4.agent.skill.summary.dedupSimilarity=0.85
# Cooldown (hours) before the same prompt fingerprint generates again.
# browser4.agent.skill.summary.cooldownHours=6
# Drafts directory; empty = <app data>/agent/skills-drafts.
# browser4.agent.skill.summary.draftsDir=

# Agent execution engine: the CLI tool loop (driving browser4-cli) is the only
# engine. `browser4.agent.runEngine` is gone; the `engine` argument survives as
# a deprecated compatibility option that only accepts `cli` (`cli-tool-loop`),
# and the removed `observe-act` ids are rejected with an explicit error.
