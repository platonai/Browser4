spring.main.allow-bean-definition-overriding=true
spring.config.import=optional:classpath:application-private.yml,optional:classpath:application-private.properties

# The application name used by the Pulsar SDK's AppContext to resolve
# APP_DATA_DIR (~/.browser4).  Also set as -Dapp.name=browser4 by the CLI
# daemon for processes that start via browser4-cli; this property serves
# as the default when launched without the CLI (IDE, direct java -jar, etc.).
# Must be a Java system property, not just a Spring property — the daemon
# injects it via -D to reach System.getProperty before Spring boots.
app.name=browser4

# the main banner
# spring.main.banner-mode=OFF
spring.banner.location=classpath:logo.txt

# debug=true

server.port=8182

# 2 for dev, 5 for product, or set a reasonable value according to your task and hardware
browser.context.number=2

# browser runtime plugin is enabled by default; set false to disable browser beans
# browser.enabled=true

# Default display mode. AI-agent usage is the primary audience, and the CLI
# sends an explicit headed flag on every open/goto, so the shipped default is
# HEADLESS (no visible browser window). `--headed` on open, or an explicit
# `browser.display.mode=GUI` overlay, opts back into a visible window.
browser.display.mode=HEADLESS
# max open tabs allowed for each browser
browser.max.active.tabs=8

# Extra Chrome command-line arguments, whitespace-separated; use double quotes
# to group an argument that contains whitespace, e.g.
# browser.launch.chrome.args=--disable-features=Translate --proxy-server="http=foopy:80;ftp=foopy2"
# Note: programmatic settings (built-in fields / addArgument) take precedence; a configured
# argument only takes effect when the same key is not effectively set by the program.

# Other launch arguments that were previously hard-coded, now configurable:
# browser.launch.window.position=0,0
# browser.launch.page.load.strategy=none
# browser.launch.throw.exception.on.script.error=true

spring.jackson.default-property-inclusion=NON_NULL
