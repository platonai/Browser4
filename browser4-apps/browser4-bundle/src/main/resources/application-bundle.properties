spring.main.allow-bean-definition-overriding=true
spring.main.lazy-initialization=true

server.port=18182
server.servlet.context-path=/
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.jackson.serialization.INDENT_OUTPUT=true

# ── Crawl checkpoint / resume ──────────────────────────────────────────
# Whether a crawl that was running when the process died is resumed at
# startup, from its checkpoint.  OFF by default: a restart is not consent to
# keep hitting third-party sites.  With it off, such a task is reported as
# "Interrupted" and waits for `browser4-cli crawl resume <task-id>`.
# See docs/crawl-checkpoint-resume.md
crawl.autoResume=false

management.endpoints.web.exposure.include=*
