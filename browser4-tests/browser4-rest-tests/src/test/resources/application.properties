# The embedded MCP-over-HTTP server (Ktor, port 8088) is opt-in and off by
# default. REST tests exercise the Spring MVC MCPToolController instead, so keep
# it explicitly disabled here too: several Spring test contexts share this
# Surefire JVM (forkCount=1, reuseForks=true), and an enabled server would both
# bind 8088 repeatedly and launch a browser session per context.
mcp.http.enabled=false
