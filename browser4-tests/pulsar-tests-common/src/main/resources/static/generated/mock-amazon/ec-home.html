<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{TITLE}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header { background:#222; color:#fff; padding:1rem; }
    nav ul { list-style:none; padding:0; margin:0; display:grid; grid-template-columns: repeat(auto-fill,minmax(180px,1fr)); gap:.5rem; }
    nav li { background:#f5f5f5; padding:.5rem .75rem; border-radius:4px; }
    nav a { text-decoration:none; color:#036; }
    h1, h2 { margin: .5rem 1rem; }
    .product-grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap:1rem; padding:0 1rem; }
    .product-card { border:1px solid #ccc; padding:.5rem; border-radius:4px; background:#fff; }
    .product-card img { max-width:100%; height:140px; object-fit:cover; display:block; margin:0 auto .5rem; }
    .product-title { font-size:1rem; margin:.25rem 0; }
    .product-link { text-decoration:none; color:inherit; display:block; }
    .product-meta { font-size:.85rem; color:#333; display:flex; gap:.5rem; }
    .product-price { font-weight:bold; color:#b12704; }
    .product-badges { margin-top:.25rem; }
    .badge { background:#ff9800; color:#000; padding:2px 4px; font-size:.65rem; border-radius:3px; margin-right:2px; }
    footer { margin-top:2rem; font-size:.8rem; text-align:center; color:#666; }
  </style>
</head>
<body>
  <header><h1>Mock Ecommerce Home</h1></header>
  <main>
    <section id="category-list-section">
      <h2>Categories</h2>
      <nav aria-label="Category navigation">
        <ul id="category-list">
          <!--CATEGORY_LINKS-->
        </ul>
      </nav>
    </section>
    <section id="featured-products-section">
      <h2>Featured Products</h2>
      <div id="featured-list" class="product-grid">
        <!--FEATURED_PRODUCTS-->
      </div>
    </section>
  </main>
  <footer>Mock EC &copy; Seeded Data</footer>
</body>
</html>
