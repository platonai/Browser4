<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nested Frame Host</title>
  <style>
    body { font-family: sans-serif; padding: 8px; }
    iframe { width: 380px; height: 140px; border: 1px solid #888; }
  </style>
</head>
<body>
  <h4 id="nested-heading">Nested frame host</h4>
  <button id="nested-button" type="button">Nested Button</button>
  <div id="nested-state">nested-initial</div>
  <iframe id="inner-frame" name="innerframe" src="./frame-inner.html"></iframe>
  <script>
    document.getElementById('nested-button').addEventListener('click', function () {
      document.getElementById('nested-state').textContent = 'nested-clicked';
    });
  </script>
</body>
</html>
