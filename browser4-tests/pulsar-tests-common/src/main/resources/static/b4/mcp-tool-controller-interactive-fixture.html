<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Browser4 CLI Interactive Fixture</title>
  <style>
    body { margin: 0; font-family: sans-serif; min-height: 2400px; }
    #mouse-area {
      position: fixed;
      top: 0;
      left: 0;
      width: 480px;
      height: 320px;
      background: rgba(0, 128, 255, 0.08);
      border: 1px solid #08f;
    }
    #drag-source, #drag-target {
      width: 160px;
      height: 48px;
      margin-top: 16px;
      border: 1px solid #555;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="mouse-area">mouse area</div>
  <main style="padding: 360px 24px 24px;">
    <input id="type-target" type="text" />
    <input id="fill-target" type="text" />
    <input id="file-input" type="file" />
    <input id="check-target" type="checkbox" />
    <select id="select-target">
      <option value="">-- choose --</option>
      <option value="green">Green</option>
      <option value="blue">Blue</option>
    </select>
    <button id="click-target" type="button">Click</button>
    <button id="dblclick-target" type="button">Double Click</button>
    <button id="hover-target" type="button">Hover</button>
    <button id="prompt-target" type="button">Prompt</button>
    <button id="confirm-target" type="button">Confirm</button>
    <div id="drag-source" draggable="true">drag source</div>
    <div id="drag-target">drag target</div>
    <pre id="state-log"></pre>
  </main>
  <script>
    window.__browser4State = {
      clickCount: 0,
      clickButton: '',
      clickPosition: null,
      doubleClickCount: 0,
      rightClickCount: 0,
      middleClickCount: 0,
      modifierClick: { count: 0, shiftKey: false, ctrlKey: false, altKey: false, metaKey: false },
      hovered: false,
      hoverEnterCount: 0,
      hoverLeaveCount: 0,
      contextMenuFired: false,
      dragStarted: false,
      dragDropped: '',
      promptResult: '',
      confirmResult: '',
      keyEvents: [],
      keyDownCount: 0,
      keyUpCount: 0,
      mouseDownCount: 0,
      mouseDownButton: '',
      mouseUpCount: 0,
      mouseUpButton: '',
      mouseEnteredArea: false,
      mouseLeftArea: false,
      lastMouse: null,
      lastWheel: null,
      wheelEvents: [],
      scrollY: 0,
      typeValue: '',
      fillValue: '',
      checkbox: false,
      selectValue: '',
      uploadCount: 0,
      uploadName: '',
      submitCount: 0,
      focusEvents: []
    };

    function syncState() {
      const state = window.__browser4State;
      state.typeValue = document.getElementById('type-target').value;
      state.fillValue = document.getElementById('fill-target').value;
      state.checkbox = document.getElementById('check-target').checked;
      state.selectValue = document.getElementById('select-target').value;
      state.scrollY = Math.round(window.scrollY);
      const files = document.getElementById('file-input').files;
      state.uploadCount = files ? files.length : 0;
      state.uploadName = files && files[0] ? files[0].name : '';
      document.getElementById('state-log').textContent = JSON.stringify(state);
    }

    document.getElementById('click-target').addEventListener('click', (event) => {
      window.__browser4State.clickCount += 1;
      window.__browser4State.clickButton = 'left';
      window.__browser4State.clickPosition = [Math.round(event.clientX), Math.round(event.clientY)];
      window.__browser4State.modifierClick.shiftKey = event.shiftKey;
      window.__browser4State.modifierClick.ctrlKey = event.ctrlKey;
      window.__browser4State.modifierClick.altKey = event.altKey;
      window.__browser4State.modifierClick.metaKey = event.metaKey;
      if (event.shiftKey || event.ctrlKey || event.altKey || event.metaKey) {
        window.__browser4State.modifierClick.count += 1;
      }
      syncState();
    });

    document.getElementById('click-target').addEventListener('contextmenu', (event) => {
      event.preventDefault();
      window.__browser4State.rightClickCount += 1;
      syncState();
    });

    document.getElementById('click-target').addEventListener('mousedown', (event) => {
      if (event.button === 2) window.__browser4State.rightClickCount += 1;
      if (event.button === 1) window.__browser4State.middleClickCount += 1;
      syncState();
    });

    document.getElementById('click-target').addEventListener('auxclick', (event) => {
      event.preventDefault();
      if (event.button === 1) window.__browser4State.middleClickCount += 1;
      syncState();
    });

    document.getElementById('dblclick-target').addEventListener('dblclick', () => {
      window.__browser4State.doubleClickCount += 1;
      syncState();
    });

    document.getElementById('hover-target').addEventListener('mouseenter', () => {
      window.__browser4State.hovered = true;
      window.__browser4State.hoverEnterCount += 1;
      syncState();
    });

    document.getElementById('hover-target').addEventListener('mouseleave', () => {
      window.__browser4State.hovered = false;
      window.__browser4State.hoverLeaveCount += 1;
      syncState();
    });

    document.getElementById('drag-source').addEventListener('dragstart', (event) => {
      window.__browser4State.dragStarted = true;
      event.dataTransfer.setData('text/plain', 'drag-source');
      syncState();
    });

    document.getElementById('drag-target').addEventListener('dragover', (event) => {
      event.preventDefault();
    });

    document.getElementById('drag-target').addEventListener('drop', (event) => {
      event.preventDefault();
      window.__browser4State.dragDropped = event.dataTransfer.getData('text/plain');
      syncState();
    });

    document.getElementById('prompt-target').addEventListener('click', () => {
      setTimeout(() => {
        const value = window.prompt('Enter prompt text', 'seed');
        window.__browser4State.promptResult = value === null ? '__dismissed__' : value;
        syncState();
      }, 0);
    });

    document.getElementById('confirm-target').addEventListener('click', () => {
      setTimeout(() => {
        const accepted = window.confirm('Confirm action');
        window.__browser4State.confirmResult = accepted ? 'accepted' : 'dismissed';
        syncState();
      }, 0);
    });

    document.getElementById('fill-target').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        window.__browser4State.submitCount += 1;
        syncState();
      }
    });

    document.addEventListener('keydown', (event) => {
      window.__browser4State.keyEvents.push({
        type: 'down',
        key: event.key,
        code: event.code,
        shiftKey: event.shiftKey,
        ctrlKey: event.ctrlKey,
        altKey: event.altKey,
        metaKey: event.metaKey,
        repeat: event.repeat
      });
      window.__browser4State.keyDownCount += 1;
      if (window.__browser4State.keyEvents.length > 200) window.__browser4State.keyEvents.shift();
      syncState();
    });

    document.addEventListener('keyup', (event) => {
      window.__browser4State.keyEvents.push({
        type: 'up',
        key: event.key,
        code: event.code,
        shiftKey: event.shiftKey,
        ctrlKey: event.ctrlKey,
        altKey: event.altKey,
        metaKey: event.metaKey
      });
      window.__browser4State.keyUpCount += 1;
      if (window.__browser4State.keyEvents.length > 200) window.__browser4State.keyEvents.shift();
      syncState();
    });

    document.getElementById('type-target').addEventListener('input', syncState);
    document.getElementById('fill-target').addEventListener('input', syncState);
    document.getElementById('check-target').addEventListener('change', syncState);
    document.getElementById('select-target').addEventListener('change', syncState);
    document.getElementById('file-input').addEventListener('change', syncState);

    // ── Focus tracking ──────────────────────────────────────────
    ['type-target', 'fill-target'].forEach(function(id) {
      var el = document.getElementById(id);
      el.addEventListener('focus', function() {
        window.__browser4State.focusEvents.push({ target: id, event: 'focus' });
        if (window.__browser4State.focusEvents.length > 50) window.__browser4State.focusEvents.shift();
        syncState();
      });
      el.addEventListener('blur', function() {
        window.__browser4State.focusEvents.push({ target: id, event: 'blur' });
        if (window.__browser4State.focusEvents.length > 50) window.__browser4State.focusEvents.shift();
        syncState();
      });
    });

    const mouseArea = document.getElementById('mouse-area');
    mouseArea.addEventListener('mousemove', (event) => {
      window.__browser4State.lastMouse = [Math.round(event.clientX), Math.round(event.clientY)];
      syncState();
    });
    mouseArea.addEventListener('mousedown', (event) => {
      window.__browser4State.mouseDownCount += 1;
      window.__browser4State.mouseDownButton = ['left','middle','right'][event.button] || 'unknown';
      syncState();
    });
    mouseArea.addEventListener('mouseup', (event) => {
      window.__browser4State.mouseUpCount += 1;
      window.__browser4State.mouseUpButton = ['left','middle','right'][event.button] || 'unknown';
      syncState();
    });
    mouseArea.addEventListener('mouseenter', () => {
      window.__browser4State.mouseEnteredArea = true;
      window.__browser4State.mouseLeftArea = false;
      syncState();
    });
    mouseArea.addEventListener('mouseleave', () => {
      window.__browser4State.mouseLeftArea = true;
      syncState();
    });
    // Chromium CDP bug workaround (crbug.com/444929150): Input.dispatchMouseEvent
    // for wheel events uses a non-blocking synthetic event that may fire after
    // the CDP promise resolves — or never fire at all in headless/Docker.
    // Registering as { passive: false } forces synchronous delivery and prevents
    // the race condition that causes CDP mouseWheel commands to hang/timeout.
    mouseArea.addEventListener('wheel', (event) => {
      window.__browser4State.lastWheel = [Math.round(event.deltaX), Math.round(event.deltaY)];
      window.__browser4State.wheelEvents.push({
        deltaX: Math.round(event.deltaX),
        deltaY: Math.round(event.deltaY),
        clientX: Math.round(event.clientX),
        clientY: Math.round(event.clientY)
      });
      if (window.__browser4State.wheelEvents.length > 50) window.__browser4State.wheelEvents.shift();
      syncState();
    }, { passive: false });

    syncState();
  </script>
</body>
</html>
