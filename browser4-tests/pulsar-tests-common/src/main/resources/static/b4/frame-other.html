<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Other Frame</title>
</head>
<body>
  <h3 id="other-heading">Other frame</h3>
  <button id="other-button" type="button">Other Button</button>
  <div id="other-state">other-initial</div>
  <script>
    document.getElementById('other-button').addEventListener('click', function () {
      document.getElementById('other-state').textContent = 'other-clicked';
    });
  </script>
</body>
</html>
