name: npm Dist-Tag

# Manual repair/advance of a release dist-tag.
#
# The normal path is automatic: release.yml and release-cli.yml run
# `cli/scripts/sync-npm-dist-tag.sh` after every published release, and
# prereleases move `next` through `npm publish --tag next`. This workflow
# exists for the case that motivated it: v4.15.1 shipped with `next` still
# pointing at 4.14.0-rc.9, and re-running the whole release pipeline just to
# move a tag is both slow and risky.
#
#   gh workflow run npm-dist-tag.yml -f version=4.15.1 -f dry_run=true   # preview
#   gh workflow run npm-dist-tag.yml -f version=4.15.1                   # apply
#
# Authentication is OIDC (trusted publishing), not a long-lived token: the
# repository publishes npm through OIDC and has no valid NPM_TOKEN.  Two npm
# side prerequisites, both on the package's Trusted publishing settings
# (npmjs.com -> browser4-cli -> Settings):
#
#   1. a configuration whose workflow filename is `npm-dist-tag.yml`, matching
#      this repository, and
#   2. "Allow npm dist-tag" enabled on it (off by default; token-free dist-tag
#      operations landed 2026-09-30).
#
# Without them the run fails with an authentication error and changes nothing;
# the same tag can always be moved with an interactive `npm login`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to point the dist-tag at (must already be published)'
        required: true
        type: string
      package:
        description: 'npm package name'
        required: true
        default: 'browser4-cli'
        type: string
      dist_tag:
        description: 'Dist-tag to move'
        required: true
        default: 'next'
        type: string
      dry_run:
        description: 'Preview only (no registry change)'
        required: false
        default: false
        type: boolean
      use_token:
        description: 'Authenticate with the NPM_TOKEN secret instead of OIDC'
        required: false
        default: false
        type: boolean

concurrency:
  group: npm-dist-tag-${{ github.event.inputs.dist_tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  # Default registry, set explicitly so the OIDC exchange has a target without
  # an empty `_authToken=${NODE_AUTH_TOKEN}` placeholder in .npmrc.
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Use an npm CLI that can move dist-tags through OIDC
        run: |
          set -euo pipefail
          # OIDC dist-tag support needs npm 11.21.0+ (or 12.2.0+); the runner
          # image still ships 11.19.x, which fails with E401 before trying OIDC.
          npm install -g npm@latest
          npm --version

      # Fallback for when npm trusted publishing has not opted into dist-tag
      # operations: a granular token in NPM_TOKEN. Off by default so the
      # token-free path is the one that runs.
      - name: Configure token authentication
        if: inputs.use_token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::use_token was requested but NPM_TOKEN is empty." >&2
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          chmod 600 "$HOME/.npmrc"
          echo "Using token authentication from NPM_TOKEN."

      - name: Show dist-tags before
        env:
          PACKAGE: ${{ github.event.inputs.package }}
        run: |
          set -euo pipefail
          {
            echo "### Dist-tags before"
            echo '```json'
            npm view "$PACKAGE" dist-tags --json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sync dist-tag
        env:
          PACKAGE: ${{ github.event.inputs.package }}
          VERSION: ${{ github.event.inputs.version }}
          DIST_TAG: ${{ github.event.inputs.dist_tag }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--package "$PACKAGE" --version "$VERSION" --tag "$DIST_TAG")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          bash cli/scripts/sync-npm-dist-tag.sh "${args[@]}"

      - name: Show dist-tags after
        if: always()
        env:
          PACKAGE: ${{ github.event.inputs.package }}
        run: |
          set -euo pipefail
          {
            echo "### Dist-tags after"
            echo '```json'
            npm view "$PACKAGE" dist-tags --json || echo '(read failed)'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
