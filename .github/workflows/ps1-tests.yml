name: PowerShell Tests

# Runs bin/test.ps1 ps — every *.tests.ps1 in the repository — plus the
# skill-document lint. Fast and self-contained: no Java/Maven/Docker, ~4 min.
#
# This is the only place the *.tests.ps1 suite runs, so the suite used to run on
# the nightly schedule alone: a release line could then carry a red PS gate that
# no run ever saw.  The push/PR triggers below close that gap for this line.
#
# skills/**/*.md is in the path filters for the same reason: the M1-M8 lint step
# reads those documents, so a documentation change can fail this gate — and
# without those paths it could do so without ever triggering it.  That is
# exactly how the 4.13.x-grown references/crawl.md reached 737 lines (past the
# 500-line M6 cap) unnoticed; it is trimmed back under the cap in the same change
# that ports this gate.

on:
  # Any release line that touches PowerShell code, or the skill documents the
  # M1-M8 lint step below reads.  This workflow file is part of the filter, so a
  # change to the gate is exercised by the gate.
  push:
    branches:
      - main
      - '*.x'
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - 'skills/**/*.md'
      - '.github/workflows/ps1-tests.yml'
  # Every PR touching PowerShell code or the skill documents.
  pull_request:
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - 'skills/**/*.md'
      - '.github/workflows/ps1-tests.yml'
  # On demand.
  workflow_dispatch:
  # Nightly safety net: the only trigger that also covers the branch when
  # nothing was pushed.
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ps1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ps1-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Pester (if needed)
        shell: pwsh
        run: |
          # Pester 6.x has scoping regressions; pin to 5.x until tests are migrated.
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge '5.0' -and $_.Version -lt '6.0' })) {
              Install-Module -Name Pester -MaximumVersion '5.999' -Force -Scope CurrentUser -SkipPublisherCheck
          }
          $pester = Get-Module -ListAvailable -Name Pester |
              Where-Object { $_.Version -ge '5.0' -and $_.Version -lt '6.0' } |
              Sort-Object Version -Descending | Select-Object -First 1
          if (-not $pester) {
              # Fallback: accept 6.x if 5.x unavailable (tests may need updates)
              $pester = Get-Module -ListAvailable -Name Pester | Sort-Object Version -Descending | Select-Object -First 1
          }
          Write-Host "Pester version: $($pester.Version)"

      - name: Run PowerShell tests
        shell: pwsh
        run: ./bin/test.ps1 ps

      - name: Skill document conformance (methodology M1-M8)
        shell: pwsh
        run: ./bin/skill-doc-lint.ps1
