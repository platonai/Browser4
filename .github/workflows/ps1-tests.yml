name: PowerShell Tests

# Runs bin/test.ps1 ps — every *.tests.ps1 in the repository. Fast and
# self-contained: no Java/Maven/Docker, ~3 min.
#
# The skills/**/*.md conformance lint is *not* part of this workflow.  It lives in
# .github/workflows/skill-docs.yml with its own status check, because welding the
# two together made a drifted document report as a PowerShell failure: on a
# document past the M6 line cap, `test.ps1 ps` printed "[PASS] PowerShell tests:
# 25 passed, 0 failed" followed by "[FAIL] Skill document conformance", and the
# separately-named lint step was skipped (the step before it had failed).  Of the
# last 100 runs of this workflow, 34 failed; 24 were the M6 line-count rule on a
# skills/ document, and the Pester suites were green in every one of them.
#
# `-SkipDocs` keeps that separation at the source: this job cannot fail for a
# document, so a red "PowerShell Tests" now means PowerShell code.
#
# This is the only place the *.tests.ps1 suite runs: pr.yml parses five
# hardcoded RWS scripts without executing a suite, and ci.yml is tag-only plus
# manual dispatch. The suite therefore used to run on the nightly schedule
# alone — and a scheduled workflow is fired on the default branch only — so a
# release line could carry a red PS gate that no run ever saw. 4.14.x did: a
# stale test-type map and a call to a function the script never defined, both
# fixed in e863f936a3 and 2dd1658ea1.
#
# The command registry and the real-world scenario tasks are in the filters for
# the same reason: scripts/coverage.tests.ps1 audits them against each other
# (every browser4-cli command needs a scenario or a documented exclusion), and
# without those two paths the audit would only run on unrelated PowerShell edits
# plus the nightly cron — i.e. never on the change that creates the gap.

on:
  # Any release line that touches PowerShell code.  This workflow file is part of
  # the filter, so a change to the gate is exercised by the gate.
  push:
    branches:
      - main
      - '*.x'
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - 'cli/browser4-cli/src/commands.rs'
      - 'browser4-tests/real-world-scenarios/tasks/**'
      - '.github/workflows/ps1-tests.yml'
  # Every PR touching PowerShell code, whatever branch it targets (pr.yml only
  # guards PRs whose base is main/master, so X.Y.x PRs had no PS coverage).
  pull_request:
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - 'cli/browser4-cli/src/commands.rs'
      - 'browser4-tests/real-world-scenarios/tasks/**'
      - '.github/workflows/ps1-tests.yml'
  # On demand. GitHub only exposes workflow_dispatch once the file is on the
  # default branch, so this becomes usable after the next merge into main.
  workflow_dispatch:
  # Nightly safety net: the only trigger that also covers the default branch
  # when nothing was pushed.
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ps1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ps1-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Pester (if needed)
        shell: pwsh
        run: |
          # Pester 6.x has scoping regressions; pin to 5.x until tests are migrated.
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge '5.0' -and $_.Version -lt '6.0' })) {
              Install-Module -Name Pester -MaximumVersion '5.999' -Force -Scope CurrentUser -SkipPublisherCheck
          }
          $pester = Get-Module -ListAvailable -Name Pester |
              Where-Object { $_.Version -ge '5.0' -and $_.Version -lt '6.0' } |
              Sort-Object Version -Descending | Select-Object -First 1
          if (-not $pester) {
              # Fallback: accept 6.x if 5.x unavailable (tests may need updates)
              $pester = Get-Module -ListAvailable -Name Pester | Sort-Object Version -Descending | Select-Object -First 1
          }
          Write-Host "Pester version: $($pester.Version)"

      - name: Run PowerShell tests
        shell: pwsh
        run: ./bin/test.ps1 ps -SkipDocs
