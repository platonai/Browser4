name: Release JAR, Docker, and CLI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-dry_run.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v4.9.0, v4.9.0-rc.1, v4.9.0-alpha.1, or v4.9.0-dry_run.1'
        required: true
        type: string
      skip_tests:
        description: 'Skip smoke tests and CLI E2E tests'
        required: false
        default: false
        type: boolean
      skip_cli_npm_publish:
        description: 'Skip browser4-cli npm publish'
        required: false
        default: false
        type: boolean
      skip_cli_binary_build:
        description: 'Skip building browser4-cli binaries'
        required: false
        default: false
        type: boolean
      skip_docker_push:
        description: 'Skip pushing Docker images to Docker Hub and GHCR'
        required: false
        default: false
        type: boolean
      debug_mode:
        description: 'Enable verbose diagnostics'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Validate the entire pipeline without publishing or pushing artifacts externally'
        required: false
        default: false
        type: boolean
      bundle_only:
        description: 'Run only the runtime-bundle build (skip Docker, CLI, publish)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: browser4
  CONTAINER_NAME: browser4
  NETWORK_NAME: 'browser4_backend'
  DOCKER_USERNAME: galaxyeye88
  PRODUCTION_JAR_MODULE_NAME: browser4-standalone
  PRODUCTION_JAR_MODULE_PATH: browser4-apps/browser4-standalone
  PRODUCTION_JAR_NAME: Browser4.jar
  PRODUCTION_JAR_PATH: browser4-apps/browser4-standalone/target/Browser4.jar
  BUNDLE_MODULE_NAME: browser4-bundle
  BUNDLE_MODULE_PATH: browser4-apps/browser4-bundle
  BUNDLE_JAR_NAME: Browser4Bundle.jar
  BUNDLE_JAR_PATH: browser4-apps/browser4-bundle/target/Browser4Bundle.jar
  JAVA_VERSION: '17'
  BUNDLE_JAVA_VERSION: '25'
  NODE_VERSION: '24'
  MAVEN_OPTS: '-Xmx3g -XX:+UseG1GC'
  CLI_PACKAGE_DIR: cli
  CLI_PACKAGE_NAME: browser4-cli
  CLI_MANIFEST_PATH: cli/browser4-cli/Cargo.toml

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      is_prerelease: ${{ steps.prepare.outputs.is_prerelease }}
      npm_version: ${{ steps.prepare.outputs.npm_version }}
      cli_npm_lookup_status: ${{ steps.prepare.outputs.cli_npm_lookup_status }}
      skip_tests: ${{ steps.prepare.outputs.skip_tests }}
      skip_cli_npm_publish: ${{ steps.prepare.outputs.skip_cli_npm_publish }}
      skip_cli_binary_build: ${{ steps.prepare.outputs.skip_cli_binary_build }}
      skip_docker_push: ${{ steps.prepare.outputs.skip_docker_push }}
      debug_mode: ${{ steps.prepare.outputs.debug_mode }}
      dry_run: ${{ steps.prepare.outputs.dry_run }}
      bundle_only: ${{ steps.prepare.outputs.bundle_only }}
      should_publish_artifacts: ${{ steps.prepare.outputs.should_publish_artifacts }}
      cli_version: ${{ steps.prepare.outputs.cli_version }}
      cli_should_build: ${{ steps.prepare.outputs.cli_should_build }}
      cli_should_publish_npm: ${{ steps.prepare.outputs.cli_should_publish_npm }}
      release_title: ${{ steps.prepare.outputs.release_title }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Prepare outputs
        id: prepare
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
          INPUT_SKIP_TESTS: ${{ github.event.inputs.skip_tests || 'false' }}
          INPUT_SKIP_CLI_NPM_PUBLISH: ${{ github.event.inputs.skip_cli_npm_publish || 'false' }}
          INPUT_SKIP_CLI_BINARY_BUILD: ${{ github.event.inputs.skip_cli_binary_build || 'false' }}
          INPUT_SKIP_DOCKER_PUSH: ${{ github.event.inputs.skip_docker_push || 'false' }}
          INPUT_DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          INPUT_BUNDLE_ONLY: ${{ github.event.inputs.bundle_only || 'false' }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            if [ -z "$TAG" ]; then
              echo "❌ workflow_dispatch requires a tag input"
              exit 1
            fi
            git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1 || {
              echo "❌ Tag not found in repository: $TAG"
              exit 1
            }
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|dry_run)\.[0-9]+)?$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Expected: X.Y.Z, X.Y.Z-alpha.N, X.Y.Z-beta.N, X.Y.Z-rc.N, or X.Y.Z-dry_run.N"
            exit 1
          fi

          IS_PRERELEASE="false"
          if [[ "$VERSION" == *"-"* ]]; then
            IS_PRERELEASE="true"
          fi

          EFFECTIVE_DRY_RUN="$INPUT_DRY_RUN"
          IS_ALPHA="false"
          IS_DRY_RUN_TAG="false"
          IS_FORCED_DRY_RUN_TAG="false"
          FORCED_DRY_RUN_TAG_KIND=""
          if [[ "$VERSION" =~ -(alpha|dry_run)\.[0-9]+$ ]]; then
            IS_FORCED_DRY_RUN_TAG="true"
            FORCED_DRY_RUN_TAG_KIND="${BASH_REMATCH[1]}"
            EFFECTIVE_DRY_RUN="true"
          fi

          if [ "$FORCED_DRY_RUN_TAG_KIND" = "alpha" ]; then
            IS_ALPHA="true"
          fi
          if [ "$FORCED_DRY_RUN_TAG_KIND" = "dry_run" ]; then
            IS_DRY_RUN_TAG="true"
          fi

          SHOULD_PUBLISH_ARTIFACTS="true"
          if [ "$EFFECTIVE_DRY_RUN" = "true" ]; then
            SHOULD_PUBLISH_ARTIFACTS="false"
          fi

          BUNDLE_ONLY="$INPUT_BUNDLE_ONLY"

          CLI_VERSION=$(node -p "require('./${{ env.CLI_PACKAGE_DIR }}/package.json').version")
          PACKAGE_NAME=$(node -p "require('./${{ env.CLI_PACKAGE_DIR }}/package.json').name")

          NPM_VERSION="unknown"
          CLI_NPM_LOOKUP_STATUS="failed"
          if NPM_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null); then
            CLI_NPM_LOOKUP_STATUS="success"
          else
            echo "::warning::Unable to query npm version for $PACKAGE_NAME. npm publish will be skipped for this run."
          fi

          CLI_SHOULD_BUILD="true"
          if [ "$INPUT_SKIP_CLI_BINARY_BUILD" = "true" ]; then
            CLI_SHOULD_BUILD="false"
          fi

          CLI_SHOULD_PUBLISH_NPM="false"
          if [ "$CLI_SHOULD_BUILD" = "true" ] && [ "$INPUT_SKIP_CLI_NPM_PUBLISH" != "true" ] && [ "$CLI_NPM_LOOKUP_STATUS" = "success" ] && [ "$CLI_VERSION" != "$NPM_VERSION" ]; then
            CLI_SHOULD_PUBLISH_NPM="true"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "cli_npm_lookup_status=$CLI_NPM_LOOKUP_STATUS" >> "$GITHUB_OUTPUT"
          echo "skip_tests=$INPUT_SKIP_TESTS" >> "$GITHUB_OUTPUT"
          echo "skip_cli_npm_publish=$INPUT_SKIP_CLI_NPM_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "skip_cli_binary_build=$INPUT_SKIP_CLI_BINARY_BUILD" >> "$GITHUB_OUTPUT"
          echo "skip_docker_push=$INPUT_SKIP_DOCKER_PUSH" >> "$GITHUB_OUTPUT"
          echo "debug_mode=$INPUT_DEBUG_MODE" >> "$GITHUB_OUTPUT"
          echo "dry_run=$EFFECTIVE_DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "bundle_only=$BUNDLE_ONLY" >> "$GITHUB_OUTPUT"
          echo "should_publish_artifacts=$SHOULD_PUBLISH_ARTIFACTS" >> "$GITHUB_OUTPUT"
          echo "cli_version=$CLI_VERSION" >> "$GITHUB_OUTPUT"
          echo "cli_should_build=$CLI_SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "cli_should_publish_npm=$CLI_SHOULD_PUBLISH_NPM" >> "$GITHUB_OUTPUT"
          echo "release_title=🚀 Browser4 $VERSION" >> "$GITHUB_OUTPUT"

          {
            echo "## 🚀 Release Preparation"
            echo ""
            echo "- **Tag**: $TAG"
            echo "- **Version**: $VERSION"
            echo "- **Prerelease**: $IS_PRERELEASE"
            echo "- **Forced Dry-Run Tag**: $IS_FORCED_DRY_RUN_TAG"
            echo "- **Alpha Release**: $IS_ALPHA"
            echo "- **Dry-Run Tag**: $IS_DRY_RUN_TAG"
            echo "- **CLI Version**: $CLI_VERSION"
            echo "- **npm Version**: $NPM_VERSION"
            echo "- **npm Lookup Status**: $CLI_NPM_LOOKUP_STATUS"
            echo "- **Build CLI Binaries**: $CLI_SHOULD_BUILD"
            echo "- **Publish CLI to npm**: $CLI_SHOULD_PUBLISH_NPM"
            echo "- **Publish Build Artifacts**: $SHOULD_PUBLISH_ARTIFACTS"
            echo "- **Skip Tests**: $INPUT_SKIP_TESTS"
            echo "- **Skip Docker Push**: $INPUT_SKIP_DOCKER_PUSH"
            echo "- **Dry Run**: $EFFECTIVE_DRY_RUN"
            if [ "$IS_FORCED_DRY_RUN_TAG" = "true" ]; then
              echo ""
              echo "> ℹ️ **FORCED DRY-RUN TAG DETECTED** — $FORCED_DRY_RUN_TAG_KIND tags automatically enable dry-run mode, so external artifact publishing is skipped."
            fi
            if [ "$IS_ALPHA" = "true" ]; then
              echo ""
              echo "> ℹ️ **ALPHA TAG DETECTED** — alpha releases are forced into dry-run mode, so external artifact publishing is skipped."
            fi
            if [ "$IS_DRY_RUN_TAG" = "true" ]; then
              echo ""
              echo "> ℹ️ **DRY_RUN TAG DETECTED** — dry_run tags automatically enable dry-run mode, so external artifact publishing is skipped."
            fi
            if [ "$EFFECTIVE_DRY_RUN" = "true" ]; then
              echo ""
              echo "> ⚠️ **DRY RUN MODE** — builds and tests will execute, but no artifacts will be published externally."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-core-and-docker:
    name: Build core artifacts and Docker image
    needs: prepare
    if: needs.prepare.outputs.bundle_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Validate Release Configuration
        shell: bash
        run: |
          echo "🔍 Validating release configuration..."
          echo "Tag: ${{ needs.prepare.outputs.tag }}"
          echo "Version: ${{ needs.prepare.outputs.version }}"
          if [ "${{ needs.prepare.outputs.is_prerelease }}" = "true" ]; then
            echo "Release type: Prerelease (RC)"
          else
            echo "Release type: Production"
          fi
          echo "✅ Valid release configuration detected"

      - name: Setup Environment
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          java_version: ${{ env.JAVA_VERSION }}
          enable_cache: 'true'

      - name: Export release environment
        shell: bash
        run: |
          echo "VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"
          echo "TAG=${{ needs.prepare.outputs.tag }}" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=${{ needs.prepare.outputs.is_prerelease }}" >> "$GITHUB_ENV"

      - name: Update Version
        shell: bash
        run: |
          node bin/version.mjs release

      - name: Maven Build
        id: maven-build
        uses: ./.github/actions/maven-build
        with:
          maven_profiles: 'all-main-modules,asset-standalone'
          skip_tests: 'true'
          parallel_builds: 'true'
          timeout_minutes: '20'
          maven_args: '-B -V'

      - name: Validate Standalone JAR
        id: validate-jar
        shell: bash
        run: |
          echo "::group::🔍 Validating Standalone JAR"
          JAR_PATH="${{ env.PRODUCTION_JAR_PATH }}"

          if [ ! -f "$JAR_PATH" ]; then
            echo "❌ Standalone JAR not found: $JAR_PATH"
            echo "Available JAR files:"
            find . -name "*.jar" -type f | sort
            exit 1
          fi

          JAR_SIZE=$(stat -c%s "$JAR_PATH" 2>/dev/null || echo 0)
          echo "📏 JAR size: $JAR_SIZE bytes ($(numfmt --to=iec --suffix=B $JAR_SIZE 2>/dev/null || echo "$JAR_SIZE bytes"))"

          if [ "$JAR_SIZE" -lt 1000000 ]; then
            echo "❌ JAR file is too small (< 1 MiB). The build may have produced an empty or incomplete artifact."
            exit 1
          fi

          # Validate the JAR contains the expected Spring Boot application.
          # Check MANIFEST.MF Start-Class — the authoritative source for what
          # Spring Boot launches.
          EXPECTED_START_CLASS="ai.platon.pulsar.apps.Browser4StandaloneApplicationKt"

          jar xf "$JAR_PATH" META-INF/MANIFEST.MF 2>/dev/null || true
          if [ -f META-INF/MANIFEST.MF ]; then
            echo "--- MANIFEST.MF ---"
            grep -E '^(Main-Class|Start-Class)' META-INF/MANIFEST.MF || echo "(no Main-Class/Start-Class entry)"
            echo "--- END MANIFEST.MF ---"

            ACTUAL_START_CLASS=$(grep '^Start-Class:' META-INF/MANIFEST.MF | sed 's/Start-Class: //' | tr -d '[:space:]')
            if [ "$ACTUAL_START_CLASS" = "$EXPECTED_START_CLASS" ]; then
              echo "✅ Start-Class is correct: $ACTUAL_START_CLASS"
            else
              echo "❌ Wrong Start-Class — expected '$EXPECTED_START_CLASS', got '$ACTUAL_START_CLASS'"
              echo "    The JAR at $JAR_PATH was not built from browser4-standalone."
              exit 1
            fi
          else
            echo "❌ No MANIFEST.MF found in JAR — not a valid Spring Boot fat JAR"
            exit 1
          fi

          echo "::endgroup::"

      - name: Cleanup Docker system to free space
        shell: bash
        run: |
          docker system prune -af
          docker volume prune -f
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo df -h

      - name: Compute build metadata
        id: build-meta
        shell: bash
        run: echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        id: docker-build
        uses: ./.github/actions/docker-build
        with:
          image_name: '${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}'
          version: ${{ needs.prepare.outputs.version }}
          dockerfile: 'Dockerfile'
          timeout_minutes: '25'
          build_args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ steps.build-meta.outputs.build_date }}
            VCS_REF=${{ github.sha }}

      - name: Security Scan Docker Image
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          echo "::group::Security Scanning"

          image="${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}"

          has_docker_scout() {
            docker scout version >/dev/null 2>&1
          }

          if has_docker_scout; then
            echo "🔍 Running Docker Scout security scan..."
            docker scout cves "$image" --only-severity critical,high || echo "⚠️ Docker Scout scan completed with warnings"
          fi

          if command -v trivy &> /dev/null; then
            echo "🔍 Running Trivy security scan..."
            trivy image --severity HIGH,CRITICAL "$image" || echo "⚠️ Trivy scan completed with warnings"
          fi

          if ! has_docker_scout && ! command -v trivy &> /dev/null; then
            echo "ℹ️ No security scanning tools available"
          fi

          echo "::endgroup::"

      - name: Start Docker container for testing
        if: success() && needs.prepare.outputs.skip_tests != 'true'
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "🧪 Starting Docker container for testing..."

          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY secret is empty or not set — the container may start but E2E tests that require an LLM backend will likely fail."
          fi

          docker network create ${{ env.NETWORK_NAME }} || true

          # Override JAVA_OPTS for CI — the Dockerfile default (-Xmx10G)
          # exceeds GitHub Actions' 7 GB runner memory and will crash the JVM.
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --network ${{ env.NETWORK_NAME }} \
            -p 8182:8182 \
            --add-host=host.docker.internal:host-gateway \
            -e OPENROUTER_API_KEY="${OPENROUTER_API_KEY}" \
            -e JAVA_OPTS="-Xms512M -Xmx3G -XX:+UseG1GC" \
            --health-cmd="curl -f http://localhost:8182/actuator/health || exit 1" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=8 \
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}

          echo "📋 Container status after launch:"
          docker ps -a --filter "name=${{ env.CONTAINER_NAME }}"

          # Quick check: did the container even start?
          sleep 3
          early_status=$(docker inspect --format="{{.State.Status}}" ${{ env.CONTAINER_NAME }} 2>/dev/null || echo "missing")
          if [ "$early_status" = "exited" ] || [ "$early_status" = "dead" ]; then
            echo "❌ Container exited immediately (exit code $(docker inspect --format='{{.State.ExitCode}}' ${{ env.CONTAINER_NAME }})):"
            docker logs ${{ env.CONTAINER_NAME }} || true
            exit 1
          fi

          echo "⏳ Waiting for container to be healthy (up to 120s) ..."
          timeout 120s bash -c '
            while true; do
              status=$(docker inspect --format="{{.State.Status}}" ${{ env.CONTAINER_NAME }} 2>/dev/null || echo "missing")
              health=$(docker inspect --format="{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}" ${{ env.CONTAINER_NAME }} 2>/dev/null || echo "missing")

              echo "container status=$status health=$health"

              if [ "$status" = "missing" ]; then
                echo "❌ Container disappeared before becoming healthy"
                exit 1
              fi

              if [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
                echo "❌ Container exited (code $(docker inspect --format='{{.State.ExitCode}}' ${{ env.CONTAINER_NAME }})) before becoming healthy"
                docker logs ${{ env.CONTAINER_NAME }} || true
                exit 1
              fi

              if [ "$health" = "healthy" ]; then
                exit 0
              fi

              sleep 5
            done
          ' || {
            echo "❌ Container did not become healthy within 120s"
            docker ps -a --filter "name=${{ env.CONTAINER_NAME }}"
            echo "--- container logs ---"
            docker logs ${{ env.CONTAINER_NAME }} || true
            exit 1
          }

          echo "✅ Container is healthy and ready for testing"

      - name: Setup Rust Toolchain
        if: success() && needs.prepare.outputs.skip_tests != 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: stable

      - name: Cache Rust Build Artifacts
        if: success() && needs.prepare.outputs.skip_tests != 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: cli/browser4-cli

      - name: Run browser4-cli E2E Tests
        id: e2e-cli
        if: success() && needs.prepare.outputs.skip_tests != 'true'
        timeout-minutes: 15
        shell: bash
        env:
          BROWSER4_E2E_SERVICE_URL: http://localhost:8182
          BROWSER4_E2E_FIXTURE_HOST: host.docker.internal
        run: |
          echo "::group::🧪 browser4-cli E2E Tests"
          cd cli/browser4-cli
          cargo test --test e2e -- --nocapture --level=EXTENDED --enable-batch-scenario
          cd "$(git rev-parse --show-toplevel)"
          echo "::endgroup::"

      - name: Cleanup Docker test resources
        if: always()
        uses: ./.github/actions/cleanup-resources
        with:
          container_name: ${{ env.CONTAINER_NAME }}
          network_name: ${{ env.NETWORK_NAME }}
          cleanup_compose: 'false'
          cleanup_volumes: 'true'

      - name: Create Release Notes
        if: success()
        uses: ./.github/actions/create-release-notes
        id: release-notes
        with:
          version: ${{ needs.prepare.outputs.version }}
          jar_name: ${{ env.PRODUCTION_JAR_NAME }}
          jar_path: ${{ env.PRODUCTION_JAR_PATH }}
          java_version: ${{ env.JAVA_VERSION }}+
          output_file: release_notes.md

      - name: Append CLI notes
        if: success()
        shell: bash
        run: |
          cat >> release_notes.md <<EOF

          ## browser4-cli

          This release also includes prebuilt \`browser4-cli\` binaries for:
          - Linux x64
          - Linux ARM64
          - Linux musl x64
          - Linux musl ARM64
          - Windows x64
          - macOS x64
          - macOS ARM64

          npm package:
          \`npm install -g browser4-cli\`

          CLI package version in this release workflow:
          - \`${{ needs.prepare.outputs.cli_version }}\`

          ## Self-contained Browser4 runtime bundles

          This release also includes self-contained Browser4 runtime bundles with:
          - a \`lib/\` directory containing \`Browser4Bundle.jar\` and all runtime dependencies
          - a minimal \`jlink\`-built JRE under \`runtime/\`
          - platform-specific launcher scripts in \`bin/\`

          Runtime model:
          \`runtime/bin/java -cp "lib/*" <MainClass>\`

          Supported release assets:
          - \`browser4-bundle-runtime-windows-x64.zip\`
          - \`browser4-bundle-runtime-linux-x64.tar.gz\`
          - \`browser4-bundle-runtime-darwin-arm64.tar.gz\`

          Recommended install flow:

          \`browser4-cli install\`
          EOF

      - name: Upload JAR artifact
        if: success() && needs.prepare.outputs.should_publish_artifacts == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: release-jar
          path: ${{ env.PRODUCTION_JAR_PATH }}
          retention-days: 7

      - name: Upload release notes artifact
        if: success() && needs.prepare.outputs.should_publish_artifacts == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: release_notes.md
          retention-days: 7

      - name: Push Docker Images to Docker Hub
        if: success() && needs.prepare.outputs.skip_docker_push != 'true' && needs.prepare.outputs.dry_run != 'true'
        shell: bash
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ env.DOCKER_USERNAME }}" --password-stdin

          IS_PRERELEASE="${{ needs.prepare.outputs.is_prerelease }}"
          if [ "$IS_PRERELEASE" != "true" ]; then
            docker tag ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }} ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          fi

          push_images() {
            docker push ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }} || return 1
            if [ "$IS_PRERELEASE" != "true" ]; then
              docker push ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest || return 1
            fi
            return 0
          }

          max_retries=3
          for i in $(seq 1 $max_retries); do
            if push_images; then
              echo "✅ Successfully pushed images to Docker Hub"
              break
            else
              if [ $i -lt $max_retries ]; then
                echo "⚠️ Push failed, retrying ($i/$max_retries)..."
                sleep 5
              else
                echo "❌ Failed to push Docker Hub images after $max_retries attempts"
                exit 1
              fi
            fi
          done

      - name: Push Docker Images to GitHub Container Registry
        if: success() && needs.prepare.outputs.skip_docker_push != 'true' && needs.prepare.outputs.dry_run != 'true'
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          IS_PRERELEASE="${{ needs.prepare.outputs.is_prerelease }}"
          docker tag ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }} ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
          if [ "$IS_PRERELEASE" != "true" ]; then
            docker tag ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }} ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          fi

          push_images() {
            docker push ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }} || return 1
            if [ "$IS_PRERELEASE" != "true" ]; then
              docker push ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest || return 1
            fi
            return 0
          }

          max_retries=3
          for i in $(seq 1 $max_retries); do
            if push_images; then
              echo "✅ Successfully pushed images to GHCR"
              break
            else
              if [ $i -lt $max_retries ]; then
                echo "⚠️ Push failed, retrying ($i/$max_retries)..."
                sleep 5
              else
                echo "❌ Failed to push GHCR images after $max_retries attempts"
                exit 1
              fi
            fi
          done

      - name: Core build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 📦 Core Build Summary"
            echo ""
            echo "- **Maven Build**: ${{ steps.maven-build.outcome }}"
            echo "- **Docker Build**: ${{ steps.docker-build.outcome }}"
            echo "- **CLI E2E**: ${{ steps.e2e-cli.outcome || 'skipped' }}"
            echo "- **JAR**: ${{ steps.validate-jar.outcome }}"
            echo "- **Docker Push**: ${{ needs.prepare.outputs.skip_docker_push == 'true' && 'skipped' || needs.prepare.outputs.dry_run == 'true' && 'skipped (dry-run)' || 'enabled' }}"
            echo "- **Dry Run**: ${{ needs.prepare.outputs.dry_run == 'true' && '✅ active' || 'no' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  build-cli-binaries:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.cli_should_build == 'true' && needs.prepare.outputs.bundle_only != 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: browser4-cli-linux-x64
            use_zigbuild: true
          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: browser4-cli-linux-arm64
            use_zigbuild: true
          - name: Linux musl x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: browser4-cli-linux-musl-x64
            use_zigbuild: true
          - name: Linux musl ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: browser4-cli-linux-musl-arm64
            use_zigbuild: true
          # Cross-compiled on Linux for Windows x64 (mingw-w64 toolchain).
          # Avoids the slower and costlier windows-latest runner.
          - name: Windows x64
            os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            binary: browser4-cli-win32-x64.exe
            use_zigbuild: false
          - name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
            binary: browser4-cli-darwin-x64
            use_zigbuild: false
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: browser4-cli-darwin-arm64
            use_zigbuild: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Sync CLI version metadata
        shell: bash
        run: node bin/version.mjs cli sync

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-x86-64-linux-gnu mingw-w64

      - name: Install Zig
        if: matrix.use_zigbuild
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2.2.1
        with:
          version: '0.13.0'

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        shell: bash
        run: cargo install cargo-zigbuild

      - name: Configure Rust linkers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"

          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          EOF

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: cli/browser4-cli

      - name: Build with zigbuild
        if: matrix.use_zigbuild
        shell: bash
        run: cargo zigbuild --release --manifest-path ${{ env.CLI_MANIFEST_PATH }} --target ${{ matrix.target }}

      - name: Build with cargo
        if: ${{ !matrix.use_zigbuild }}
        shell: bash
        run: cargo build --release --manifest-path ${{ env.CLI_MANIFEST_PATH }} --target ${{ matrix.target }}

      - name: Copy binary artifact
        shell: bash
        run: |
          mkdir -p artifacts
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp cli/browser4-cli/target/${{ matrix.target }}/release/browser4-cli.exe artifacts/${{ matrix.binary }}
          else
            cp cli/browser4-cli/target/${{ matrix.target }}/release/browser4-cli artifacts/${{ matrix.binary }}
            chmod +x artifacts/${{ matrix.binary }}
          fi

      - name: Upload artifact
        if: needs.prepare.outputs.should_publish_artifacts == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.binary }}
          path: artifacts/${{ matrix.binary }}
          retention-days: 7

  build-runtime-bundles:
    name: Build runtime bundle (${{ matrix.name }})
    needs: [prepare, build-core-and-docker]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build-core-and-docker.result == 'success' || needs.build-core-and-docker.result == 'skipped')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            asset_name: browser4-bundle-runtime-windows-x64.zip
            artifact_name: browser4-bundle-runtime-windows-x64
          - name: Linux x64
            os: ubuntu-latest
            asset_name: browser4-bundle-runtime-linux-x64.tar.gz
            artifact_name: browser4-bundle-runtime-linux-x64
          # macOS x64 (disabled — macos-13 runner deprecated; re-enable when
          # cross-compilation from macos-14 or macos-latest is available):
          # - name: macOS x64
          #   os: macos-13
          #   asset_name: browser4-bundle-runtime-darwin-x64.tar.gz
          #   artifact_name: browser4-bundle-runtime-darwin-x64
          - name: macOS ARM64
            os: macos-14
            asset_name: browser4-bundle-runtime-darwin-arm64.tar.gz
            artifact_name: browser4-bundle-runtime-darwin-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup JDK ${{ env.BUNDLE_JAVA_VERSION }} for jlink
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.BUNDLE_JAVA_VERSION }}
          cache: maven

      - name: Prepare bundle build environment
        shell: pwsh
        run: |
          if ($IsWindows) {
            Write-Host "Using Windows Maven wrapper" -ForegroundColor Cyan
          }
          else {
            chmod +x ./mvnw
            Write-Host "Ensured execute permission for mvnw" -ForegroundColor Cyan
          }

          java -version

      - name: Build Browser4 runtime bundle
        shell: pwsh
        run: |
          ./browser4-apps/browser4-bundle/build-runtime-bundle.ps1 `
            -JarPath "${{ env.BUNDLE_JAR_PATH }}" `
            -OutputDirectory "browser4-apps/browser4-bundle/target/runtime-release" `
            -AssetName "${{ matrix.asset_name }}" `
            -Force

      - name: Verify Browser4 runtime bundle (structure only)
        if: runner.os != 'Linux'  # Full functional test on Linux only
        shell: pwsh
        run: |
          ./browser4-apps/browser4-bundle/verify-runtime-bundle.ps1 `
            -BundlePath "browser4-apps/browser4-bundle/target/runtime-release/${{ matrix.asset_name }}" `
            -ExpectedAssetName "${{ matrix.asset_name }}" `
            -SkipFunctionalTest

      - name: Verify Browser4 runtime bundle (full functional test)
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          ./browser4-apps/browser4-bundle/verify-runtime-bundle.ps1 `
            -BundlePath "browser4-apps/browser4-bundle/target/runtime-release/${{ matrix.asset_name }}" `
            -ExpectedAssetName "${{ matrix.asset_name }}" `
            -StartupTimeoutSeconds 300

      - name: Upload runtime bundle artifact
        if: needs.prepare.outputs.should_publish_artifacts == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: browser4-apps/browser4-bundle/target/runtime-release/${{ matrix.asset_name }}
          retention-days: 7

  smoke-test-runtime-bundle:
    name: Smoke test (${{ matrix.name }})
    needs: [prepare, build-runtime-bundles]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.build-runtime-bundles.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            asset_name: browser4-bundle-runtime-windows-x64.zip
            artifact_name: browser4-bundle-runtime-windows-x64
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            os: ubuntu-latest
            asset_name: browser4-bundle-runtime-linux-x64.tar.gz
            artifact_name: browser4-bundle-runtime-linux-x64
            target: x86_64-unknown-linux-gnu
          - name: macOS ARM64
            os: macos-14
            asset_name: browser4-bundle-runtime-darwin-arm64.tar.gz
            artifact_name: browser4-bundle-runtime-darwin-arm64
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download runtime bundle artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/

      - name: Install Chrome (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome &>/dev/null || command -v google-chrome-stable &>/dev/null; then
            echo "✅ Chrome found: $(which google-chrome google-chrome-stable 2>/dev/null || true)"
          else
            echo "::group::Installing chromium-browser..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium-browser
            echo "::endgroup::"
          fi
          df -h /dev/shm || true

      - name: Install Chrome (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then
            echo "✅ Google Chrome found"
          elif command -v chromium &>/dev/null; then
            echo "✅ Chromium found: $(which chromium)"
          else
            echo "::group::Installing Google Chrome..."
            brew install --cask google-chrome
            echo "::endgroup::"
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI binary
        shell: bash
        run: |
          cargo build --release --manifest-path ${{ env.CLI_MANIFEST_PATH }} --target ${{ matrix.target }}

      - name: Run smoke test
        shell: bash
        timeout-minutes: 15
        env:
          BROWSER4_SERVER_LOG_DIR: ${{ runner.temp }}/browser4-server-logs
        run: |
          BUNDLE_ARCHIVE=$(ls artifacts/browser4-bundle-runtime-* 2>/dev/null | head -1)
          if [ -z "$BUNDLE_ARCHIVE" ]; then
            echo "❌ No bundle archive found in artifacts/"
            ls -la artifacts/ || true
            exit 1
          fi
          echo "Bundle archive: $BUNDLE_ARCHIVE"
          chmod +x cli/scripts/smoke-test-runtime-bundle.sh
          # On Windows / Git Bash, cargo appends .exe; resolve it explicitly
          # rather than relying on MSYS2 transparent extension handling.
          CLI_BIN="cli/browser4-cli/target/${{ matrix.target }}/release/browser4-cli"
          if [ ! -f "$CLI_BIN" ] && [ -f "${CLI_BIN}.exe" ]; then
            CLI_BIN="${CLI_BIN}.exe"
          fi
          bash cli/scripts/smoke-test-runtime-bundle.sh \
            "$CLI_BIN" \
            "$BUNDLE_ARCHIVE" 0 300

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-test-logs-${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/browser4-server-logs/
          retention-days: 7

      - name: Smoke test summary
        if: always()
        shell: bash
        run: |
          echo "::group::📊 Smoke Test Summary"
          echo "🎯 Platform: ${{ matrix.name }}"
          echo "📦 Bundle: ${{ matrix.asset_name }}"
          echo "📊 Status: ${{ job.status }}"
          echo "::endgroup::"

  publish-cli-npm:
    name: Publish browser4-cli to npm
    needs: [prepare, build-core-and-docker, build-cli-binaries]
    if: needs.prepare.outputs.cli_should_publish_npm == 'true' && needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.bundle_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Sync CLI version metadata
        shell: bash
        run: node bin/version.mjs cli sync

      - name: Re-check npm version before publish
        id: cli_publish_check
        shell: bash
        run: |
          set -euo pipefail

          eval "$(node cli/scripts/check-npm-publish-needed.js --shell)"

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "cli_version=$CLI_VERSION" >> "$GITHUB_OUTPUT"
          echo "remote_version=$REMOTE_VERSION" >> "$GITHUB_OUTPUT"
          echo "lookup_status=$LOOKUP_STATUS" >> "$GITHUB_OUTPUT"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

          if [ "$SHOULD_PUBLISH" != "true" ]; then
            echo "::notice::Skipping npm publish because $PACKAGE_NAME@$CLI_VERSION already exists on npm."
          elif [ "$LOOKUP_STATUS" = "failed" ]; then
            echo "::warning::Unable to query npm version for $PACKAGE_NAME before publish. Proceeding because the prepare job determined a publish was required."
          fi

          {
            echo "## 🔎 CLI Publish Re-check"
            echo ""
            echo "- **Package**: $PACKAGE_NAME"
            echo "- **Local CLI Version**: $CLI_VERSION"
            echo "- **Remote npm Version**: $REMOTE_VERSION"
            echo "- **Lookup Status**: $LOOKUP_STATUS"
            echo "- **Will Publish**: $SHOULD_PUBLISH"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download all CLI binary artifacts
        if: steps.cli_publish_check.outputs.should_publish == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: browser4-cli-*
          path: artifacts/
          merge-multiple: true

      - name: Move binaries into CLI package bin directory
        if: steps.cli_publish_check.outputs.should_publish == 'true'
        shell: bash
        run: |
          mkdir -p cli/bin
          find artifacts -maxdepth 1 -type f -name 'browser4-cli-*' -exec mv {} cli/bin/ \;
          rm -rf artifacts
          chmod +x cli/bin/browser4-cli-* 2>/dev/null || true
          echo "Binaries in cli/bin/:"
          ls -la cli/bin/

      - name: Verify all packaged binaries exist
        if: steps.cli_publish_check.outputs.should_publish == 'true'
        shell: bash
        run: |
          EXPECTED_BINARIES=(
            "browser4-cli-linux-x64"
            "browser4-cli-linux-arm64"
            "browser4-cli-linux-musl-x64"
            "browser4-cli-linux-musl-arm64"
            "browser4-cli-win32-x64.exe"
            "browser4-cli-darwin-x64"
            "browser4-cli-darwin-arm64"
          )
          MIN_SIZE=100000
          ERRORS=0

          for binary in "${EXPECTED_BINARIES[@]}"; do
            if [ ! -f "cli/bin/$binary" ]; then
              echo "ERROR: Missing cli/bin/$binary"
              ERRORS=$((ERRORS + 1))
            else
              SIZE=$(stat -c%s "cli/bin/$binary" 2>/dev/null)
              if [ "$SIZE" -lt "$MIN_SIZE" ]; then
                echo "ERROR: cli/bin/$binary is too small ($SIZE bytes, expected >= $MIN_SIZE)"
                ERRORS=$((ERRORS + 1))
              else
                echo "OK: cli/bin/$binary ($SIZE bytes)"
              fi
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "Error: $ERRORS binary issues found"
            exit 1
          fi

          echo "All 7 platform binaries are present and valid"

      - name: Publish to npm
        if: steps.cli_publish_check.outputs.should_publish == 'true'
        working-directory: ${{ env.CLI_PACKAGE_DIR }}
        run: npm publish --provenance

      - name: Verify npm package was published
        if: steps.cli_publish_check.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME='${{ steps.cli_publish_check.outputs.package_name }}'
          CLI_VERSION='${{ steps.cli_publish_check.outputs.cli_version }}'

          for attempt in 1 2 3 4 5; do
            PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$CLI_VERSION" version 2>/dev/null || true)
            if [ "$PUBLISHED_VERSION" = "$CLI_VERSION" ]; then
              echo "Verified $PACKAGE_NAME@$CLI_VERSION on npm"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "npm registry has not reported $PACKAGE_NAME@$CLI_VERSION yet (attempt $attempt/5); retrying in 10s..."
              sleep 10
            fi
          done

          echo "Unable to verify $PACKAGE_NAME@$CLI_VERSION on npm after publish"
          exit 1

      - name: npm publish summary
        if: always()
        shell: bash
        run: |
          if [ "${{ needs.prepare.outputs.dry_run }}" = "true" ]; then
            echo "## 📦 CLI npm Publish (skipped — dry-run)"
            exit 0
          fi
          {
            echo "## 📦 CLI npm Publish"
            echo ""
            echo "- **CLI Version**: ${{ needs.prepare.outputs.cli_version }}"
            echo "- **Remote npm Version (publish-time)**: ${{ steps.cli_publish_check.outputs.remote_version }}"
            echo "- **Publish Re-check Status**: ${{ steps.cli_publish_check.outputs.lookup_status }}"
            echo "- **Publish Executed**: ${{ steps.cli_publish_check.outputs.should_publish }}"
            echo "- **Status**: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-github-release:
    name: Publish GitHub release
    needs:
      - prepare
      - build-core-and-docker
      - build-cli-binaries
      - build-runtime-bundles
      - smoke-test-runtime-bundle
      - publish-cli-npm
    if: |
      always() &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.prepare.outputs.bundle_only != 'true' &&
      needs.build-core-and-docker.result == 'success' &&
      (needs.build-cli-binaries.result == 'success' || needs.build-cli-binaries.result == 'skipped') &&
      needs.build-runtime-bundles.result == 'success' &&
      (needs.smoke-test-runtime-bundle.result == 'success' || needs.smoke-test-runtime-bundle.result == 'skipped') &&
      (needs.publish-cli-npm.result == 'success' || needs.publish-cli-npm.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      attestations: write
      id-token: write

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v7
        with:
          name: release-jar
          path: release-assets/

      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: release-notes/

      - name: Download CLI artifacts
        if: needs.prepare.outputs.cli_should_build == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: browser4-cli-*
          path: release-assets/
          merge-multiple: true

      - name: Download runtime bundle artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: browser4-bundle-runtime-*
          path: release-assets/
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: |
          echo "Release assets:"
          ls -la release-assets/
          echo ""
          echo "Release notes:"
          ls -la release-notes/

      - name: Verify release assets
        shell: bash
        run: |
          if [ ! -f "release-assets/${{ env.PRODUCTION_JAR_NAME }}" ]; then
            echo "❌ Missing JAR asset"
            exit 1
          fi

          if [ "${{ needs.prepare.outputs.cli_should_build }}" = "true" ]; then
            BINARY_COUNT=$(find release-assets -maxdepth 1 -type f -name 'browser4-cli-*' | wc -l)
            if [ "$BINARY_COUNT" -lt 7 ]; then
              echo "❌ Expected 7 CLI binaries, found $BINARY_COUNT"
              ls -la release-assets/
              exit 1
            fi
          fi

          RUNTIME_BUNDLE_COUNT=$(find release-assets -maxdepth 1 -type f \( -name 'browser4-bundle-runtime-*.zip' -o -name 'browser4-bundle-runtime-*.tar.gz' \) | wc -l)
          if [ "$RUNTIME_BUNDLE_COUNT" -lt 3 ]; then
            echo "❌ Expected 3 Browser4 runtime bundles, found $RUNTIME_BUNDLE_COUNT"
            ls -la release-assets/
            exit 1
          fi

          echo "✅ Release assets verified"

      - name: Build release asset manifest
        id: asset_manifest
        shell: bash
        run: |
          {
            echo 'files<<EOF'
            echo "release-assets/${{ env.PRODUCTION_JAR_NAME }}"
            if [ "${{ needs.prepare.outputs.cli_should_build }}" = "true" ]; then
              find release-assets -maxdepth 1 -type f -name 'browser4-cli-*' | sort
            fi
            find release-assets -maxdepth 1 -type f \( -name 'browser4-bundle-runtime-*.zip' -o -name 'browser4-bundle-runtime-*.tar.gz' \) | sort
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: ${{ steps.asset_manifest.outputs.files }}
          name: ${{ needs.prepare.outputs.release_title }}
          body_path: release-notes/release_notes.md
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          make_latest: ${{ needs.prepare.outputs.is_prerelease == 'true' && 'false' || 'true' }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate Artifact Attestation
        if: success()
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018  # v1.4.4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: false
        with:
          subject-path: release-assets/${{ env.PRODUCTION_JAR_NAME }}

      - name: Verify Release
        shell: bash
        run: |
          echo "::group::✅ Release Verification"

          JAR_SIZE=$(stat -c%s "release-assets/${{ env.PRODUCTION_JAR_NAME }}" 2>/dev/null || echo 0)

          echo "🎉 Release ${{ needs.prepare.outputs.version }} created successfully!"
          echo ""
          echo "📦 Release Details:"
          echo "  - Tag: ${{ needs.prepare.outputs.tag }}"
          echo "  - JAR: ${{ env.PRODUCTION_JAR_NAME }}"
          echo "  - Size: $(numfmt --to=iec --suffix=B $JAR_SIZE)"
          echo "  - Prerelease: ${{ needs.prepare.outputs.is_prerelease }}"
          echo "  - CLI Version: ${{ needs.prepare.outputs.cli_version }}"
          echo "  - Runtime bundles:"
          find release-assets -maxdepth 1 -type f \( -name 'browser4-bundle-runtime-*.zip' -o -name 'browser4-bundle-runtime-*.tar.gz' \) -printf '    - %f\n' | sort
          echo ""
          echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}"
          echo ""
          echo "📥 Download Command:"
          echo "wget https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/${{ env.PRODUCTION_JAR_NAME }}"

          echo "::endgroup::"

      - name: Release Summary
        if: success()
        shell: bash
        run: |
          {
            echo "## 🚀 Release ${{ needs.prepare.outputs.version }} Summary"
            echo ""
            echo "### ✅ Build Status"
            echo "- **Version**: ${{ needs.prepare.outputs.version }}"
            echo "- **Tag**: ${{ needs.prepare.outputs.tag }}"
            echo "- **Prerelease**: ${{ needs.prepare.outputs.is_prerelease }}"
            echo "- **Commit**: ${{ github.sha }}"
            echo ""
            echo "### 📦 Artifacts"
            echo "- **JAR**: ${{ env.PRODUCTION_JAR_NAME }}"
            echo "- **Runtime Bundles**: browser4-bundle-runtime-windows-x64.zip, browser4-bundle-runtime-linux-x64.tar.gz, browser4-bundle-runtime-darwin-arm64.tar.gz"
            echo "- **CLI Version**: ${{ needs.prepare.outputs.cli_version }}"
            echo "- **npm Version**: ${{ needs.prepare.outputs.npm_version }}"
            echo "- **npm Lookup Status**: ${{ needs.prepare.outputs.cli_npm_lookup_status }}"
            echo "- **Docker Image**: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}"
            echo "- **GHCR Image**: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}"
            echo ""
            echo "### 🔗 Links"
            echo "- [Release Page](https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }})"
            echo "- [Docker Hub](https://hub.docker.com/r/${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }})"
            echo "- [GitHub Container Registry](https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/pkgs/container/${{ env.IMAGE_NAME }})"
            echo ""
            echo "### 📊 Job Results"
            echo "- **Prepare**: ${{ needs.prepare.result }}"
            echo "- **Core Build + Docker**: ${{ needs.build-core-and-docker.result }}"
            echo "- **CLI Binary Build**: ${{ needs.build-cli-binaries.result }}"
            echo "- **Runtime Bundle Build**: ${{ needs.build-runtime-bundles.result }}"
            echo "- **CLI npm Publish**: ${{ needs.publish-cli-npm.result }}"
            echo ""
            echo "✅ Release pipeline completed successfully!"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger OSS Sync
        if: success()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh workflow run sync-to-oss.yml \
            --repo "${{ github.repository }}" \
            -f tag_name="${{ needs.prepare.outputs.tag }}"; then
            echo "✅ OSS sync workflow triggered"
          else
            echo "::warning::Failed to trigger OSS sync workflow — it may need to be triggered manually."
          fi

  cleanup-on-failure:
    name: Report failed release
    needs:
      - prepare
      - build-core-and-docker
      - build-cli-binaries
      - build-runtime-bundles
      - smoke-test-runtime-bundle
      - publish-cli-npm
      - publish-github-release
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cleanup failed tag
        shell: bash
        run: |
          echo "⚠️ Release workflow failed!"
          echo "Release tag: ${{ needs.prepare.outputs.tag }}"
          echo "::warning::Release failed. Tag cleanup is intentionally disabled to avoid partially published artifacts becoming orphaned. Review the failed jobs before retrying."
