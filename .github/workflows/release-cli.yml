name: Release CLI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  CLI_PACKAGE_DIR: cli
  CLI_PACKAGE_NAME: browser4-cli
  CLI_MANIFEST_PATH: cli/browser4-cli/Cargo.toml
  NODE_VERSION: '24'

jobs:
  check-release:
    name: Check CLI version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      needs_github_release: ${{ steps.check.outputs.needs_github_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Compare CLI package version with npm and existing GitHub release
        id: check
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./${{ env.CLI_PACKAGE_DIR }}/package.json').name")
          LOCAL_VERSION=$(node -p "require('./${{ env.CLI_PACKAGE_DIR }}/package.json').version")
          TAG="v$LOCAL_VERSION"

          echo "Package name: $PACKAGE_NAME"
          echo "Local version: $LOCAL_VERSION"

          NPM_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "0.0.0")
          echo "npm version: $NPM_VERSION"

          if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
            echo "Version changed: $NPM_VERSION -> $LOCAL_VERSION"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "needs_github_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged on npm, skipping npm publish"
            echo "should_release=false" >> "$GITHUB_OUTPUT"

            if gh release view "$TAG" &>/dev/null; then
              echo "GitHub release $TAG exists"
              echo "needs_github_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "GitHub release $TAG is missing, will rebuild and attach CLI binaries"
              echo "needs_github_release=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-binaries:
    name: Build ${{ matrix.name }}
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true' || needs.check-release.outputs.needs_github_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: browser4-cli-linux-x64
            use_zigbuild: true
          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: browser4-cli-linux-arm64
            use_zigbuild: true
          - name: Linux musl x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: browser4-cli-linux-musl-x64
            use_zigbuild: true
          - name: Linux musl ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: browser4-cli-linux-musl-arm64
            use_zigbuild: true
          - name: Windows x64
            os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            binary: browser4-cli-win32-x64.exe
            use_zigbuild: false
          - name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
            binary: browser4-cli-darwin-x64
            use_zigbuild: false
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: browser4-cli-darwin-arm64
            use_zigbuild: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Sync CLI version metadata
        run: node cli/scripts/sync-version.js

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-x86-64-linux-gnu mingw-w64

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        shell: bash
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild

      - name: Configure Rust linkers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"

          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          EOF

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli/browser4-cli

      - name: Build with zigbuild
        if: matrix.use_zigbuild
        shell: bash
        run: cargo zigbuild --release --manifest-path ${{ env.CLI_MANIFEST_PATH }} --target ${{ matrix.target }}

      - name: Build with cargo
        if: ${{ !matrix.use_zigbuild }}
        shell: bash
        run: cargo build --release --manifest-path ${{ env.CLI_MANIFEST_PATH }} --target ${{ matrix.target }}

      - name: Copy binary artifact
        shell: bash
        run: |
          mkdir -p artifacts
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp cli/browser4-cli/target/${{ matrix.target }}/release/browser4-cli.exe artifacts/${{ matrix.binary }}
          else
            cp cli/browser4-cli/target/${{ matrix.target }}/release/browser4-cli artifacts/${{ matrix.binary }}
            chmod +x artifacts/${{ matrix.binary }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: artifacts/${{ matrix.binary }}
          retention-days: 7

  publish:
    name: Publish browser4-cli to npm
    needs: [check-release, build-binaries]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Move binaries into CLI package bin directory
        shell: bash
        run: |
          mkdir -p cli/bin
          find artifacts -type f -name 'browser4-cli-*' -exec mv {} cli/bin/ \;
          rm -rf artifacts
          chmod +x cli/bin/browser4-cli-* 2>/dev/null || true
          echo "Binaries in cli/bin/:"
          ls -la cli/bin/

      - name: Verify all packaged binaries exist
        shell: bash
        run: |
          EXPECTED_BINARIES=(
            "browser4-cli-linux-x64"
            "browser4-cli-linux-arm64"
            "browser4-cli-linux-musl-x64"
            "browser4-cli-linux-musl-arm64"
            "browser4-cli-win32-x64.exe"
            "browser4-cli-darwin-x64"
            "browser4-cli-darwin-arm64"
          )
          MIN_SIZE=100000
          ERRORS=0

          for binary in "${EXPECTED_BINARIES[@]}"; do
            if [ ! -f "cli/bin/$binary" ]; then
              echo "ERROR: Missing cli/bin/$binary"
              ERRORS=$((ERRORS + 1))
            else
              SIZE=$(stat -c%s "cli/bin/$binary" 2>/dev/null || stat -f%z "cli/bin/$binary")
              if [ "$SIZE" -lt "$MIN_SIZE" ]; then
                echo "ERROR: cli/bin/$binary is too small ($SIZE bytes, expected >= $MIN_SIZE)"
                ERRORS=$((ERRORS + 1))
              else
                echo "OK: cli/bin/$binary ($SIZE bytes)"
              fi
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "Error: $ERRORS binary issues found"
            exit 1
          fi

          echo "All 7 platform binaries are present and valid"

      - name: Publish to npm
        working-directory: ${{ env.CLI_PACKAGE_DIR }}
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Upload CLI binaries to GitHub release
    needs: [check-release, build-binaries, publish]
    if: >-
      always() &&
      needs.build-binaries.result == 'success' &&
      needs.check-release.outputs.needs_github_release == 'true' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f -name 'browser4-cli-*' -exec mv {} release-assets/ \;
          rm -rf artifacts
          chmod +x release-assets/browser4-cli-* 2>/dev/null || true
          ls -la release-assets/

      - name: Verify release binaries exist
        shell: bash
        run: |
          BINARY_COUNT=$(find release-assets -maxdepth 1 -type f -name 'browser4-cli-*' | wc -l)
          if [ "$BINARY_COUNT" -lt 7 ]; then
            echo "Error: Expected 7 binaries, found $BINARY_COUNT"
            ls -la release-assets/
            exit 1
          fi
          echo "Found $BINARY_COUNT binaries"

      - name: Create or update GitHub release assets
        shell: bash
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          TAG="v$VERSION"

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, uploading browser4-cli assets..."
            gh release upload "$TAG" release-assets/browser4-cli-* --clobber
          else
            echo "Creating release $TAG with browser4-cli assets..."
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              release-assets/browser4-cli-*
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
