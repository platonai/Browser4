name: Publish browser4-cli to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-cli'
      - 'v[0-9]+.[0-9]+.[0-9]+-cli.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-cli_dry_run.[0-9]+'
  workflow_dispatch:
    inputs:
      skip_binary_build:
        description: 'Skip building CLI binaries (use if already built)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Validate without publishing to npm'
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-cli-npm-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '24'
  CLI_PACKAGE_DIR: cli
  CLI_PACKAGE_NAME: browser4-cli
  CLI_MANIFEST_PATH: cli/browser4-cli/Cargo.toml

jobs:
  prepare:
    name: Prepare metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cli_version: ${{ steps.prepare.outputs.cli_version }}
      remote_version: ${{ steps.prepare.outputs.remote_version }}
      lookup_status: ${{ steps.prepare.outputs.lookup_status }}
      skip_binary_build: ${{ steps.prepare.outputs.skip_binary_build }}
      dry_run: ${{ steps.prepare.outputs.dry_run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Prepare outputs
        id: prepare
        shell: bash
        env:
          INPUT_SKIP_BINARY_BUILD: ${{ github.event.inputs.skip_binary_build || 'false' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TAG_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          CLI_VERSION=$(node -p "require('./${{ env.CLI_PACKAGE_DIR }}/package.json').version")
          PACKAGE_NAME=$(node -p "require('./${{ env.CLI_PACKAGE_DIR }}/package.json').name")

          # Detect dry_run from tag name (e.g., v0.0.0-cli_dry_run.1)
          DRY_RUN="$INPUT_DRY_RUN"
          if [[ "$TAG_REF" == *"dry_run"* ]]; then
            DRY_RUN="true"
            echo "::notice::Tag contains 'dry_run' — forcing dry-run mode, will not publish to npm."
          fi

          REMOTE_VERSION="unknown"
          LOOKUP_STATUS="failed"
          SHOULD_PUBLISH="false"

          if REMOTE_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null); then
            LOOKUP_STATUS="success"
            if [ "$CLI_VERSION" != "$REMOTE_VERSION" ]; then
              SHOULD_PUBLISH="true"
            fi
          else
            echo "::warning::Unable to query npm version for $PACKAGE_NAME"
          fi

          echo "cli_version=$CLI_VERSION" >> "$GITHUB_OUTPUT"
          echo "remote_version=$REMOTE_VERSION" >> "$GITHUB_OUTPUT"
          echo "lookup_status=$LOOKUP_STATUS" >> "$GITHUB_OUTPUT"
          echo "skip_binary_build=$INPUT_SKIP_BINARY_BUILD" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

          {
            echo "## 📦 browser4-cli npm Publish"
            echo ""
            echo "- **Package**: $PACKAGE_NAME"
            echo "- **Local Version**: $CLI_VERSION"
            echo "- **Remote Version**: $REMOTE_VERSION"
            echo "- **Should Publish**: $SHOULD_PUBLISH"
            echo "- **Skip Binary Build**: $INPUT_SKIP_BINARY_BUILD"
            echo "- **Dry Run**: $DRY_RUN"
            if [ "$DRY_RUN" = "true" ] && [[ "$TAG_REF" == *"dry_run"* ]]; then
              echo "- **Dry Run Source**: tag"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: E2E tests (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Sync CLI version metadata
        shell: bash
        run: node cli/scripts/sync-version.js

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: cli/browser4-cli

      - name: Run e2e tests
        shell: bash
        run: cargo test --test e2e --manifest-path ${{ env.CLI_MANIFEST_PATH }} -- --nocapture --force-remote-bundle

  build-binaries:
    name: Build ${{ matrix.name }}
    needs: [prepare, test]
    if: needs.prepare.outputs.skip_binary_build != 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # NOTE: if you add/remove a target, update EXPECTED_COUNT in the
        # "Verify all packaged binaries exist" step in the publish job.
        include:
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: browser4-cli-linux-x64
            use_zigbuild: true
          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: browser4-cli-linux-arm64
            use_zigbuild: true
          - name: Linux musl x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: browser4-cli-linux-musl-x64
            use_zigbuild: true
          - name: Linux musl ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: browser4-cli-linux-musl-arm64
            use_zigbuild: true
          - name: Windows x64
            os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            binary: browser4-cli-win32-x64.exe
            use_zigbuild: false
          - name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
            binary: browser4-cli-darwin-x64
            use_zigbuild: false
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: browser4-cli-darwin-arm64
            use_zigbuild: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Sync CLI version metadata
        shell: bash
        run: node cli/scripts/sync-version.js

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-x86-64-linux-gnu mingw-w64

      - name: Install Zig
        if: matrix.use_zigbuild
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2.2.1
        with:
          version: '0.13.0'

      - name: Cache cargo-zigbuild binary
        if: matrix.use_zigbuild
        id: cache-zigbuild
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-0.10.1

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild && steps.cache-zigbuild.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install cargo-zigbuild@0.10.1

      - name: Configure Rust linkers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"

          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          EOF

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: cli/browser4-cli

      - name: Build with zigbuild
        if: matrix.use_zigbuild
        shell: bash
        run: cargo zigbuild --release --manifest-path ${{ env.CLI_MANIFEST_PATH }} --target ${{ matrix.target }}

      - name: Build with cargo
        if: ${{ !matrix.use_zigbuild }}
        shell: bash
        run: cargo build --release --manifest-path ${{ env.CLI_MANIFEST_PATH }} --target ${{ matrix.target }}

      - name: Copy binary artifact
        shell: bash
        run: |
          mkdir -p artifacts
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp cli/browser4-cli/target/${{ matrix.target }}/release/browser4-cli.exe artifacts/${{ matrix.binary }}
          else
            cp cli/browser4-cli/target/${{ matrix.target }}/release/browser4-cli artifacts/${{ matrix.binary }}
            chmod +x artifacts/${{ matrix.binary }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: artifacts/${{ matrix.binary }}
          retention-days: 1

  publish:
    name: Publish to npm
    needs: [prepare, test, build-binaries]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.test.result == 'success' &&
      (needs.build-binaries.result == 'success' || needs.build-binaries.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Sync CLI version metadata
        shell: bash
        run: node cli/scripts/sync-version.js

      - name: Re-check npm version before publish
        id: check
        shell: bash
        run: |
          set -euo pipefail

          eval "$(node cli/scripts/check-npm-publish-needed.js --shell)"

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "cli_version=$CLI_VERSION" >> "$GITHUB_OUTPUT"
          echo "remote_version=$REMOTE_VERSION" >> "$GITHUB_OUTPUT"
          echo "lookup_status=$LOOKUP_STATUS" >> "$GITHUB_OUTPUT"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

          if [ "$SHOULD_PUBLISH" != "true" ]; then
            echo "::notice::Skipping npm publish — $PACKAGE_NAME@$CLI_VERSION already exists on npm."
          fi

          {
            echo "## 🔎 Publish Re-check"
            echo ""
            echo "- **Package**: $PACKAGE_NAME"
            echo "- **Local Version**: $CLI_VERSION"
            echo "- **Remote Version**: $REMOTE_VERSION"
            echo "- **Will Publish**: $SHOULD_PUBLISH"
            echo "- **Dry Run**: ${{ needs.prepare.outputs.dry_run }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download all CLI binary artifacts
        if: steps.check.outputs.should_publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: browser4-cli-*
          path: artifacts/
          merge-multiple: true

      - name: Move binaries into CLI package bin directory
        if: steps.check.outputs.should_publish == 'true'
        shell: bash
        run: |
          mkdir -p cli/bin
          find artifacts -maxdepth 1 -type f -name 'browser4-cli-*' -exec mv {} cli/bin/ \;
          rm -rf artifacts
          chmod +x cli/bin/browser4-cli-* 2>/dev/null || true
          echo "Binaries in cli/bin/:"
          ls -la cli/bin/

      - name: Verify all packaged binaries exist
        if: steps.check.outputs.should_publish == 'true'
        shell: bash
        run: |
          MIN_SIZE=100000
          # build-binaries matrix defines 7 targets — this count must stay in sync
          EXPECTED_COUNT=7
          ERRORS=0

          mapfile -t BINARIES < <(find cli/bin -maxdepth 1 -type f -name 'browser4-cli-*' | sort)
          ACTUAL_COUNT="${#BINARIES[@]}"

          if [ "$ACTUAL_COUNT" -ne "$EXPECTED_COUNT" ]; then
            echo "ERROR: Expected $EXPECTED_COUNT binaries, found $ACTUAL_COUNT"
            ERRORS=$((ERRORS + 1))
          fi

          for binary in "${BINARIES[@]}"; do
            SIZE=$(stat -c%s "$binary" 2>/dev/null || stat -f%z "$binary")
            if [ "$SIZE" -lt "$MIN_SIZE" ]; then
              echo "ERROR: $(basename "$binary") is too small ($SIZE bytes, expected >= $MIN_SIZE)"
              ERRORS=$((ERRORS + 1))
            else
              echo "OK: $(basename "$binary") ($SIZE bytes)"
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "Error: $ERRORS binary issues found"
            exit 1
          fi

          echo "All $ACTUAL_COUNT platform binaries are present and valid"

      - name: Publish to npm (dry-run)
        if: steps.check.outputs.should_publish == 'true' && needs.prepare.outputs.dry_run == 'true'
        working-directory: ${{ env.CLI_PACKAGE_DIR }}
        run: npm publish --dry-run

      - name: Publish to npm
        id: publish
        if: steps.check.outputs.should_publish == 'true' && needs.prepare.outputs.dry_run != 'true'
        working-directory: ${{ env.CLI_PACKAGE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm publish --provenance; then
              echo "publish_outcome=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm publish failed (attempt $attempt/3); retrying in 15s..."
              sleep 15
            fi
          done
          echo "publish_outcome=failure" >> "$GITHUB_OUTPUT"
          echo "❌ npm publish failed after 3 attempts"
          exit 1

      - name: Verify npm package was published
        if: steps.check.outputs.should_publish == 'true' && needs.prepare.outputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME='${{ steps.check.outputs.package_name }}'
          CLI_VERSION='${{ steps.check.outputs.cli_version }}'

          for attempt in 1 2 3 4 5; do
            PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$CLI_VERSION" version 2>/dev/null || true)
            if [ "$PUBLISHED_VERSION" = "$CLI_VERSION" ]; then
              echo "✅ Verified $PACKAGE_NAME@$CLI_VERSION on npm"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "npm registry has not reported $PACKAGE_NAME@$CLI_VERSION yet (attempt $attempt/5); retrying in 10s..."
              sleep 10
            fi
          done

          echo "❌ Unable to verify $PACKAGE_NAME@$CLI_VERSION on npm after publish"
          exit 1

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ "${{ needs.prepare.outputs.dry_run }}" = "true" ]; then
            echo "## 📦 npm Publish (dry-run — nothing published)"
            exit 0
          fi
          PUBLISH_OUTCOME="${{ steps.publish.outputs.publish_outcome }}"
          {
            echo "## 📦 npm Publish Summary"
            echo ""
            echo "- **Package**: ${{ steps.check.outputs.package_name }}"
            echo "- **Version**: ${{ steps.check.outputs.cli_version }}"
            echo "- **Remote Version**: ${{ steps.check.outputs.remote_version }}"
            echo "- **Publish Needed**: ${{ steps.check.outputs.should_publish }}"
            echo "- **Publish Result**: ${PUBLISH_OUTCOME:-skipped}"
            echo "- **Status**: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
