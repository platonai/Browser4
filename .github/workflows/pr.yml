name: PR Quality Gate

# Fast feedback gate that runs BEFORE a PR can be merged.
# Compiles all main modules, runs the fast unit-test subset, validates the
# PowerShell test scripts, and enforces a minimum JaCoCo coverage floor.
# Heavy / Integration / E2E tests are intentionally excluded here (they run in
# ci.yml on release tags and in nightly.yml) to keep PR validation quick.

on:
  pull_request:
    branches:
      - main
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx3g -XX:+UseG1GC'

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Environment
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          java_version: ${{ env.JAVA_VERSION }}

      - name: Maven Build (compile)
        id: build-maven
        uses: ./.github/actions/maven-build
        with:
          # Compile everything up front so the gate catches compilation errors
          # before spending time on tests.
          skip_tests: 'true'
          timeout_minutes: '15'
          maven_profiles: 'all-main-modules'

      - name: Validate PowerShell test scripts
        id: validate-ps1
        shell: pwsh
        run: |
          $scripts = @(
            'browser4-tests/real-world-scenarios/scripts/common.ps1',
            'browser4-tests/real-world-scenarios/scripts/common.tests.ps1',
            'browser4-tests/real-world-scenarios/scripts/run-task.ps1',
            'browser4-tests/real-world-scenarios/scripts/run-task-production.ps1',
            'browser4-tests/real-world-scenarios/scripts/run-tests.ps1'
          )
          $failed = 0
          foreach ($s in $scripts) {
            $tokens = $null; $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $s, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -eq 0) {
              Write-Host "  OK  $s" -ForegroundColor Green
            } else {
              Write-Host "  FAIL  $s" -ForegroundColor Red
              foreach ($e in $parseErrors) {
                Write-Host "    $($e.Message)" -ForegroundColor Red
              }
              $failed++
            }
          }
          if ($failed -gt 0) {
            Write-Host "`n$failed script(s) failed to parse." -ForegroundColor Red
            exit 1
          }
          Write-Host "`nAll $($scripts.Count) scripts parsed successfully." -ForegroundColor Green

      - name: Run Fast Unit Tests (coverage gate)
        id: run-tests
        uses: ./.github/actions/run-tests
        with:
          # quality-gate profile activates JaCoCo prepare-agent + report + check
          # (see pom.xml). All non-fast tags are excluded to keep the PR fast.
          maven_profiles: 'all-main-modules,quality-gate'
          excluded_groups: 'ManualOnly,RequiresAI,E2E,E2ETest,Slow,Heavy,HeavyTest,Integration,IntegrationTest,RequiresServer,RequiresBrowser,RequiresDocker,TestInfraCheck'
          timeout_minutes: '25'
          # Keep the PR fast: skip the heavy Integration/E2E modules.
          run_pulsar_tests: 'false'

      - name: Check Test Status
        run: |
          if [ "${{ steps.run-tests.outputs.test_status }}" != "success" ]; then
            echo "❌ Tests failed with status: ${{ steps.run-tests.outputs.test_status }}"
            echo "📊 Total: ${{ steps.run-tests.outputs.test_count }} | Failed: ${{ steps.run-tests.outputs.failed_count }} | Passed: ${{ steps.run-tests.outputs.passed_count }}"
            exit 1
          else
            echo "✅ All fast unit tests passed (${{ steps.run-tests.outputs.passed_count }} passed)"
          fi
