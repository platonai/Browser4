name: CI/CD Pipeline

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-ci.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+-ci.[0-9]+'
  # CI pipeline for tagged releases: Fast unit tests + Docker build + SDK tests
  # Note: Comprehensive tests (including Slow + Integration) run in nightly.yml
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: browser4
  NETWORK_NAME: 'browser4_backend'
  CONTAINER_NAME: 'browser4-test'
  DOCKER_COMPOSE_FILE: './docker-compose.yml'
  DEPENDENCY_SERVICES: 'mongodb'
  MONGODB_CONTAINER: 'mongodb'
  MONGODB_PORT: '27017'
  JAVA_VERSION: '25'
  MAVEN_OPTS: '-Xmx3g -XX:+UseG1GC'

jobs:
  ci-build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
      test_results: ${{ steps.tests.outputs.test_status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Environment
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          java_version: ${{ env.JAVA_VERSION }}

      - name: Verify Dependencies
        id: deps
        uses: ./.github/actions/verify-dependencies
        with:
          network_name: ${{ env.NETWORK_NAME }}
          compose_file: ${{ env.DOCKER_COMPOSE_FILE }}
          services_to_start: ${{ env.DEPENDENCY_SERVICES }}
          mongodb_container: ${{ env.MONGODB_CONTAINER }}
          mongodb_port: ${{ env.MONGODB_PORT }}
          startup_timeout: '120'
          verify_network_connectivity: 'true'

      - name: Maven Build
        id: build-maven
        uses: ./.github/actions/maven-build
        with:
          # Maven tests are skipped during the build phase and run separately
          # in the dedicated run-tests step below with full profile configuration.
          skip_tests: ${{ inputs.skip_tests || 'true' }}
          timeout_minutes: '15'
          maven_profiles: 'all-main-modules'

      # --- Fast feedback: run unit tests + script validation BEFORE the heavy
      #     Docker build / E2E stages, so a broken unit test fails within minutes
      #     instead of after 20+ minutes of image build + container startup. ---
      - name: Validate PowerShell test scripts
        id: validate-ps1
        shell: pwsh
        run: |
          $scripts = @(
            'browser4-tests/real-world-scenarios/scripts/common.ps1',
            'browser4-tests/real-world-scenarios/scripts/common.tests.ps1',
            'browser4-tests/real-world-scenarios/scripts/run-task.ps1',
            'browser4-tests/real-world-scenarios/scripts/run-task-production.ps1',
            'browser4-tests/real-world-scenarios/scripts/run-tests.ps1'
          )
          $failed = 0
          foreach ($s in $scripts) {
            $tokens = $null; $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $s, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -eq 0) {
              Write-Host "  OK  $s" -ForegroundColor Green
            } else {
              Write-Host "  FAIL  $s" -ForegroundColor Red
              foreach ($e in $parseErrors) {
                Write-Host "    $($e.Message)" -ForegroundColor Red
              }
              $failed++
            }
          }
          if ($failed -gt 0) {
            Write-Host "`n$failed script(s) failed to parse." -ForegroundColor Red
            exit 1
          }
          Write-Host "`nAll $($scripts.Count) scripts parsed successfully." -ForegroundColor Green

      - name: Skill document conformance (methodology M1-M8)
        shell: pwsh
        run: ./bin/skill-doc-lint.ps1

      - name: Validate install script tests
        shell: bash
        run: |
          # The installer suites are fast (~25 s) and need no Java, Docker or
          # browser.  They used to run only inside the release workflow, so a
          # suite whose assertions had silently stopped executing stayed green
          # for months; run them on every CI round instead.
          bash cli/scripts/tests/install-browser4-cli.tests.sh
          bash cli/scripts/tests/wait-for-npm-version.tests.sh
          bash cli/scripts/tests/reconcile-release-assets.tests.sh
          bash cli/scripts/tests/wait-for-oss-sync.tests.sh

      - name: Run Tests
        id: run-tests
        if: inputs.skip_tests != true
        uses: ./.github/actions/run-tests
        with:
          maven_profiles: 'all-main-modules,all-test-modules'
          # NOTE: excluded_groups REPLACES the root pom's <surefire.excludedGroups>
          # default, it does not extend it. Compared with that default
          # (Slow,Heavy,RequiresServer,RequiresBrowser,RequiresAI,RequiresDocker,
          #  Integration,E2E,ManualOnly,TestInfraCheck,IntegrationTest,E2ETest,HeavyTest)
          # this short list deliberately re-enables Integration/IntegrationTest/
          # Heavy/Requires* so the pipeline also covers the integration and
          # infrastructure suite (Chrome, Docker and the started app are available
          # here). See docs-dev/copilot/ci-stabilization-4.13.x.md before editing.
          excluded_groups: 'ManualOnly,RequiresAI,E2E,E2ETest,Slow,HeavyTest,TestInfraCheck'
          # 50 minutes, not 35. The crawl integration classes are the long pole and
          # grew to ~11 minutes each on GitHub runners (CrawlFixtureMetadataTest
          # 668.8 s + CrawlParallelTabsTest 671.7 s in run 35507033919), so the old
          # 35-minute cap killed the reactor while ScrapeServiceTests was still
          # running — the gate failed on budget with zero test failures
          # (status=timeout, Maven exit 124). See
          # docs-dev/copilot/ci-stabilization-4.13.x.md §19.7 before changing this.
          timeout_minutes: '50'

      - name: Check Test Status
        if: inputs.skip_tests != true
        run: |
          if [ "${{ steps.run-tests.outputs.test_status }}" != "success" ]; then
            echo "❌ Tests failed with status: ${{ steps.run-tests.outputs.test_status }}"
            echo "📊 Test Results:"
            echo "  - Total Tests: ${{ steps.run-tests.outputs.test_count }}"
            echo "  - Failed Tests: ${{ steps.run-tests.outputs.failed_count }}"
            echo "  - Passed Tests: ${{ steps.run-tests.outputs.passed_count }}"
            echo "  - Skipped Tests: ${{ steps.run-tests.outputs.skipped_count }}"
            echo "  - Maven exit code: ${{ steps.run-tests.outputs.run_exit_code }}"
            echo "  - Surefire reports produced: ${{ steps.run-tests.outputs.reports_found }}"
            if [ "${{ steps.run-tests.outputs.failed_count }}" = "0" ]; then
              echo ""
              echo "ℹ️  No surefire test failure was parsed, so the reactor failed outside the tests:"
              echo "    a module compile/dependency error, or a test JVM that died before writing"
              echo "    its report. Inspect the 'Run Tests' step above for the Maven error."
            fi
            FAILED_LIST="${{ steps.run-tests.outputs.failed_test_list }}"
            if [ -n "$FAILED_LIST" ]; then
              echo ""
              echo "❌ Failed Tests:"
              for test in $FAILED_LIST; do
                echo "  - $test"
              done
            fi
            # Do NOT fail the job here: the Docker build, app startup and the CLI
            # e2e stage are independent of the JVM suite.  Failing here would skip
            # all of them, so one broken JVM test would hide everything the release
            # gate exists to check.  Record the state; 'Enforce CI Gate' decides.
            echo "MAVEN_TESTS_FAILED=1" >> "$GITHUB_ENV"
            echo "⚠️  JVM test stage failed — continuing so the CLI e2e stage can run."
          else
            echo "✅ All tests passed successfully"
            echo "📊 Test Results: ${{ steps.run-tests.outputs.passed_count }} tests passed"
            echo "MAVEN_TESTS_FAILED=0" >> "$GITHUB_ENV"
          fi

      - name: Setup Rust Toolchain
        id: rust-setup
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli/browser4-cli

      - name: Cleanup Docker system to free space
        run: |
          docker system prune -af
          docker volume prune -f
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo df -h

      - name: Build Docker Image
        id: build
        uses: ./.github/actions/docker-build
        with:
          image_name: ${{ env.IMAGE_NAME }}
          version: ${{ github.sha }}
          timeout_minutes: '20'

      - name: Start Application
        id: app
        uses: ./.github/actions/start-application
        with:
          image_name: ${{ env.IMAGE_NAME }}
          version: ${{ github.sha }}
          container_name: ${{ env.CONTAINER_NAME }}
          network_name: ${{ env.NETWORK_NAME }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          proxy_rotation_url: ${{ secrets.PROXY_ROTATION_URL }}

      - name: Health Check
        id: health
        uses: ./.github/actions/health-check
        with:
          service_port: '8182'
          timeout_minutes: '5'
          container_name: ${{ env.CONTAINER_NAME }}

      - name: Run browser4-cli E2E Tests
        id: e2e-cli
        # 25 minutes for the BASIC subset (148 scenarios).  The stricter
        # --max-failures=0 below turns a truncated suite into a red gate, so the
        # budget has to be honest: nightly gives 30 minutes to the full 204-scenario
        # EXTENDED run of the same harness.
        timeout-minutes: 25
        shell: bash
        env:
          BROWSER4_E2E_SERVICE_URL: http://localhost:8182
          BROWSER4_E2E_FIXTURE_HOST: host.docker.internal
        run: |
          echo "::group::🧪 browser4-cli E2E Tests"

          # Run the CLI tests against the already-running Docker container.
          # --max-failures=0: this is a gate, not a report — a tolerated failure
          # hides damage for a whole release cycle.
          echo "Running browser4-cli E2E tests..."
          echo "Working directory: $(pwd)"
          cd cli/browser4-cli
          cargo test --test e2e -- --nocapture --max-failures=0
          # cargo test
          cd "$(git rev-parse --show-toplevel)"

          echo "::endgroup::"

      - name: Collect container logs on failure
        if: failure() && steps.e2e-cli.outcome == 'failure'
        shell: bash
        continue-on-error: true
        run: |
          echo "::group::📜 browser4-test container logs (tail 500)"
          docker logs ${{ env.CONTAINER_NAME }} --tail 500 2>&1 || echo "(container logs unavailable)"
          echo "::endgroup::"

      - name: Pipeline Summary
        if: always()
        shell: bash
        run: |
          echo "::group::📊 Pipeline Summary"

          echo "🎯 Pipeline Results:"
          echo "  - Setup: ${{ steps.setup.outcome }}"
          echo "  - Dependencies: ${{ steps.deps.outcome }}"
          echo "  - Maven Build: ${{ steps.build-maven.outcome }}"
          echo "  - Docker Build: ${{ steps.build.outcome }}"
          echo "  - Application: ${{ steps.app.outcome }}"
          echo "  - Health Check: ${{ steps.health.outcome }}"
          echo "  - CLI E2E Tests: ${{ steps.e2e-cli.outcome }}"
          echo "  - Unit Tests: ${{ steps.run-tests.outcome || 'skipped' }}"
          # Set by 'Check Test Status': 0 = passed, 1 = failed, unset = skipped
          # (inputs.skip_tests) or never reached.  'Enforce CI Gate' decides.
          echo "  - JVM test stage flag: ${MAVEN_TESTS_FAILED:-unset}"

          echo ""
          echo "🌐 Infrastructure:"
          echo "  - Network: ${{ env.NETWORK_NAME }}"
          echo "  - Container: ${{ env.CONTAINER_NAME }}"
          echo "  - Image: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "  - MongoDB: ${{ steps.deps.outputs.mongodb_status }}"
          echo "  - Redis: ${{ steps.deps.outputs.redis_status }}"

          echo ""
          echo "📅 Completed at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo "🌟 Commit: ${{ github.sha }}"

          echo "::endgroup::"

      - name: Enforce CI Gate
        # Runs after every stage so one round reports the whole picture: the JVM
        # suite AND the CLI e2e suite both execute even when the JVM stage failed.
        # This step alone decides the job outcome (mirrors nightly.yml).
        if: always()
        shell: bash
        run: |
          echo "::group::🚦 CI Gate"

          failed=0

          # skip_tests only silences the JVM stage; the Docker build, the app and
          # the CLI e2e stage still run, so the gate must still check them.
          if [ "${{ inputs.skip_tests }}" = "true" ]; then
            echo "  - JVM tests       : intentionally skipped (skip_tests input)"
          else
            maven_status="${MAVEN_TESTS_FAILED:-unset}"
            echo "  - JVM tests       : ${maven_status}"
            case "$maven_status" in
              0) echo "      ✅ JVM tests passed" ;;
              1) echo "      ❌ JVM tests failed (see 'Check Test Status' above)"; failed=1 ;;
              *) echo "      ❌ JVM tests never reported a status (setup/build/dependencies failed first)"; failed=1 ;;
            esac
          fi

          e2e_outcome="${{ steps.e2e-cli.outcome }}"
          echo "  - CLI e2e tests   : ${e2e_outcome:-<not run>}"
          if [ "${e2e_outcome:-skipped}" != "success" ]; then
            echo "      ❌ browser4-cli e2e did not pass (tolerance is 0 in this gate)"
            failed=1
          fi

          echo "::endgroup::"

          if [ "$failed" -ne 0 ]; then
            echo "❌ CI gate failed — see the per-stage summaries above."
            exit 1
          fi
          echo "✅ CI gate passed"

      - name: Cleanup Resources
        if: always()
        uses: ./.github/actions/cleanup-resources
        with:
          container_name: ${{ env.CONTAINER_NAME }}
          cleanup_compose: 'true'
          cleanup_volumes: 'true'
          network_name: ${{ env.NETWORK_NAME }}
