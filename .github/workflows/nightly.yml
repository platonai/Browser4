name: Nightly Build

on:
  schedule:
    # Runs at 00:00 UTC every day
    # This is a comprehensive nightly build including:
    # - All unit tests (Fast + Slow)
    # - Integration tests
    # - Docker image building
    # - Python SDK tests
    # Note: E2E tests run separately in cli-e2e-tests.yml (manual only)
    - cron: '0 0 * * *'
  # Allow manual workflow runs
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: browser4
  NETWORK_NAME: 'browser4_backend'
  CONTAINER_NAME: 'browser4-test'
  DOCKER_COMPOSE_FILE: './docker-compose.yml'
  DEPENDENCY_SERVICES: 'mongodb'
  MONGODB_CONTAINER: 'mongodb'
  MONGODB_PORT: '27017'
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx3g -XX:+UseG1GC'

jobs:
  nightly-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Environment
        id: setup
        if: success()
        uses: ./.github/actions/setup-environment
        with:
          java_version: ${{ env.JAVA_VERSION }}

      - name: Verify Dependencies
        id: deps
        if: success()
        uses: ./.github/actions/verify-dependencies
        with:
          network_name: ${{ env.NETWORK_NAME }}
          compose_file: ${{ env.DOCKER_COMPOSE_FILE }}
          services_to_start: ${{ env.DEPENDENCY_SERVICES }}
          mongodb_container: ${{ env.MONGODB_CONTAINER }}
          mongodb_port: ${{ env.MONGODB_PORT }}
          startup_timeout: '120'
          verify_network_connectivity: 'true'

      - name: Maven Build
        id: build-maven
        if: success()
        uses: ./.github/actions/maven-build
        with:
          skip_tests: 'true'
          timeout_minutes: '15'

      - name: Run Comprehensive Tests
        id: run-tests
        uses: ./.github/actions/run-tests
        with:
          maven_profiles: 'all-main-modules,all-test-modules'
          excluded_groups: 'ManualOnly,RequiresAI,E2E,E2ETest' # E2E tests might be flaky in CI, so we run them separately in a different workflow
          run_pulsar_tests: 'true'
          timeout_minutes: '60'

      - name: Check Test Status
        id: test-check
        if: always()
        shell: bash
        run: |
          echo "::group::🧪 Test Status Report"

          # ── Gather outputs with fallbacks ──
          TEST_STATUS="${{ steps.run-tests.outputs.test_status }}"
          TEST_COUNT="${{ steps.run-tests.outputs.test_count }}"
          FAILED_COUNT="${{ steps.run-tests.outputs.failed_count }}"
          PASSED_COUNT="${{ steps.run-tests.outputs.passed_count }}"
          SKIPPED_COUNT="${{ steps.run-tests.outputs.skipped_count }}"
          FAILED_LIST="${{ steps.run-tests.outputs.failed_test_list }}"

          # Default empty values
          TEST_STATUS="${TEST_STATUS:-skipped}"
          TEST_COUNT="${TEST_COUNT:-0}"
          FAILED_COUNT="${FAILED_COUNT:-0}"
          PASSED_COUNT="${PASSED_COUNT:-0}"
          SKIPPED_COUNT="${SKIPPED_COUNT:-0}"

          # ── Determine outcome ──
          if [ "$TEST_STATUS" = "success" ]; then
            echo "✅ All tests passed successfully"
            echo ""
            echo "📊 Test Summary:"
            echo "  • Total:   ${TEST_COUNT}"
            echo "  • Passed:  ${PASSED_COUNT}"
            echo "  • Skipped: ${SKIPPED_COUNT}"
            echo ""
            echo "📦 Test Reports: test-reports-${{ github.run_id }} (artifact)"
            echo "::endgroup::"
            exit 0
          fi

          # ── Failure / skipped path ──
          echo "❌ Tests completed with failures"
          echo ""
          echo "┌─────────────────────────────────────────────┐"
          echo "│           TEST FAILURE REPORT               │"
          echo "├─────────────────────────────────────────────┤"
          echo "│ Status:  ${TEST_STATUS}                              │"
          echo "│ Total:   ${TEST_COUNT}                              │"
          echo "│ Passed:  ${PASSED_COUNT}                              │"
          echo "│ Failed:  ${FAILED_COUNT}                              │"
          echo "│ Skipped: ${SKIPPED_COUNT}                              │"
          echo "└─────────────────────────────────────────────┘"
          echo ""

          # ── List failed test classes ──
          if [ -n "${FAILED_LIST}" ] && [ "${FAILED_LIST}" != " " ]; then
            echo "🔴 Failed Test Classes:"
            echo "───────────────────────────────────────────────"
            # FAILED_LIST is space-separated; print one per line
            for test_class in ${FAILED_LIST}; do
              # Trim whitespace
              test_class=$(echo "$test_class" | xargs)
              if [ -n "$test_class" ]; then
                echo "  ✗ ${test_class}"
              fi
            done
            echo "───────────────────────────────────────────────"
          else
            echo "⚠️  No individual failed test names captured."
            echo "   Check the 'Run Comprehensive Tests' step logs for details."
          fi

          echo ""
          echo "📦 Full test reports available in artifact:"
          echo "   Name: test-reports-${{ github.run_id }}"
          echo "   URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""

          # ── Diagnostics: show a sample of failures from Surefire XML ──
          echo "::group::🔍 Failure Details (first 3)"

          FAILURE_COUNT=0
          while IFS= read -r -d '' xml_file; do
            if [ $FAILURE_COUNT -ge 3 ]; then break; fi
            test_class=$(basename "$xml_file" .xml | sed 's/TEST-//')

            # Extract failure/error messages (if any)
            HAS_FAILURE=$(grep -c '<failure ' "$xml_file" 2>/dev/null || echo 0)
            HAS_ERROR=$(grep -c '<error ' "$xml_file" 2>/dev/null || echo 0)

            if [ "$HAS_FAILURE" -gt 0 ] || [ "$HAS_ERROR" -gt 0 ]; then
              FAILURE_COUNT=$((FAILURE_COUNT + 1))
              echo ""
              echo "── ${test_class} ──"

              # Print first failure message (trimmed)
              grep -m1 '<failure ' "$xml_file" 2>/dev/null | head -1 | sed 's/<[^>]*>//g' | cut -c1-300 || true
              grep -m1 '<error ' "$xml_file" 2>/dev/null | head -1 | sed 's/<[^>]*>//g' | cut -c1-300 || true
            fi
          done < <(find . -name "TEST-*.xml" -type f -print0 2>/dev/null)

          echo "::endgroup::"

          echo "::endgroup::"  # closes Test Status Report group
          exit 1

      - name: Cleanup Docker system to free space
        run: |
          docker system prune -af
          docker volume prune -f
          rm -rf ~/.m2/repository  # If you no longer need Maven cache
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo df -h

      - name: Build Docker Image
        id: build
        if: success()
        uses: ./.github/actions/docker-build
        with:
          image_name: ${{ env.IMAGE_NAME }}
          version: ${{ github.sha }}
          timeout_minutes: '20'

      - name: Start Application
        id: app
        if: success()
        uses: ./.github/actions/start-application
        with:
          image_name: ${{ env.IMAGE_NAME }}
          version: ${{ github.sha }}
          container_name: ${{ env.CONTAINER_NAME }}
          network_name: ${{ env.NETWORK_NAME }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          proxy_rotation_url: ${{ secrets.PROXY_ROTATION_URL }}

      - name: Health Check
        id: health
        if: success()
        uses: ./.github/actions/health-check
        with:
          service_port: '8182'
          timeout_minutes: '5'
          container_name: ${{ env.CONTAINER_NAME }}

      - name: Setup Rust Toolchain
        id: rust-setup
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli/browser4-cli

      - name: Run browser4-cli E2E Tests
        id: e2e-cli
        if: success()
        timeout-minutes: 15
        shell: bash
        env:
          BROWSER4_E2E_SERVICE_URL: http://localhost:8182
          BROWSER4_E2E_FIXTURE_HOST: host.docker.internal
        run: |
          echo "::group::🧪 browser4-cli E2E Tests"

          # Run the CLI tests against the already-running Docker container
          echo "Running browser4-cli E2E tests..."
          echo "Working directory: $(pwd)"
          cd cli/browser4-cli
          cargo test --test e2e -- --nocapture --level=EXTENDED --enable-batch-scenario
          cd "$(git rev-parse --show-toplevel)"

          echo "::endgroup::"

      - name: Pipeline Summary
        if: always()
        shell: bash
        run: |
          echo "::group::📊 Pipeline Summary"

          # Helper to map outcome to icon
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⚠️" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❓" ;;
            esac
          }

          echo "╔══════════════════════════════════════════════╗"
          echo "║         NIGHTLY BUILD RESULTS               ║"
          echo "╠══════════════════════════════════════════════╣"

          echo "║                                              ║"
          printf "║  %s %-40s ║\n" "$(icon '${{ steps.setup.outcome }}')" "Setup Environment"
          printf "║  %s %-40s ║\n" "$(icon '${{ steps.deps.outcome }}')" "Verify Dependencies"
          printf "║  %s %-40s ║\n" "$(icon '${{ steps.build-maven.outcome }}')" "Maven Build"
          printf "║  %s %-40s ║\n" "$(icon '${{ steps.run-tests.outcome }}')" "Unit Tests"
          printf "║  %s %-40s ║\n" "$(icon '${{ steps.build.outcome }}')" "Docker Build"
          printf "║  %s %-40s ║\n" "$(icon '${{ steps.app.outcome }}')" "Start Application"
          printf "║  %s %-40s ║\n" "$(icon '${{ steps.health.outcome }}')" "Health Check"

          # Only show CLI E2E if it ran (it has success() condition)
          E2E_OUTCOME="${{ steps.e2e-cli.outcome }}"
          if [ -n "${E2E_OUTCOME}" ]; then
            printf "║  %s %-40s ║\n" "$(icon "${E2E_OUTCOME}")" "CLI E2E Tests"
          fi

          echo "║                                              ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  Test Details:                               ║"

          TC="${{ steps.run-tests.outputs.test_count }}"
          FC="${{ steps.run-tests.outputs.failed_count }}"
          PC="${{ steps.run-tests.outputs.passed_count }}"
          SC="${{ steps.run-tests.outputs.skipped_count }}"
          printf "║  Tests: %-4s | Passed: %-4s | Failed: %-4s | Skip: %-4s ║\n" \
            "${TC:-?}" "${PC:-?}" "${FC:-?}" "${SC:-?}"

          # Show failed test classes if any
          FAILED_LIST="${{ steps.run-tests.outputs.failed_test_list }}"
          if [ -n "${FAILED_LIST}" ] && [ "${FAILED_LIST}" != " " ]; then
            echo "║                                              ║"
            echo "║  Failed Classes:                             ║"
            for test_class in ${FAILED_LIST}; do
              test_class=$(echo "$test_class" | xargs)
              if [ -n "$test_class" ]; then
                printf "║    ✗ %-38s ║\n" "${test_class:0:38}"
              fi
            done
          fi

          echo "╚══════════════════════════════════════════════╝"

          echo ""
          echo "🌐 Infrastructure:"
          echo "  - Network:    ${{ env.NETWORK_NAME }}"
          echo "  - Container:  ${{ env.CONTAINER_NAME }}"
          echo "  - Image:      ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "  - MongoDB:    ${{ steps.deps.outputs.mongodb_status || 'unknown' }}"
          echo "  - Redis:      ${{ steps.deps.outputs.redis_status || 'unknown' }}"

          echo ""
          echo "📅 Completed at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo "🔗 Run URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "::endgroup::"
      - name: Cleanup Resources
        if: always()
        uses: ./.github/actions/cleanup-resources
        with:
          container_name: ${{ env.CONTAINER_NAME }}
          cleanup_compose: 'true'
          cleanup_volumes: 'true'
          network_name: ${{ env.NETWORK_NAME }}
