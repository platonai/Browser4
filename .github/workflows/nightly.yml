name: Nightly Build

on:
  schedule:
    # Runs at 00:00 UTC every day
    # This is a comprehensive nightly build including:
    # - All JVM tests (Fast + Slow + HeavyTest + TestInfraCheck + Integration*)
    #   minus ManualOnly / RequiresAI / E2E / E2ETest
    # - JaCoCo coverage measured in observe-only mode (no floor: the floor
    #   belongs to pr.yml, which controls its own subset)
    # - Docker image building + the full browser4-cli e2e suite (204 scenarios,
    #   --level=EXTENDED --enable-all --max-failures=0)
    # - Rust CLI unit tests (cargo test --bin/--lib) — every other workflow only
    #   builds the `e2e` test target, so those tests run here
    # Note: the same CLI e2e suite also runs in nightly-cli.yml (03:00 UTC, 30 min
    # budget). This workflow keeps its own copy because it builds and starts the
    # Docker image from the same commit; keep both step budgets at 30 min.
    # Note: E2E/E2ETest-tagged JVM tests are still excluded everywhere (see
    # docs/TESTING.md §"CI 门禁实际覆盖" for the current inventory).
    - cron: '0 0 * * *'
  # Allow manual workflow runs
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: browser4
  NETWORK_NAME: 'browser4_backend'
  CONTAINER_NAME: 'browser4-test'
  DOCKER_COMPOSE_FILE: './docker-compose.yml'
  DEPENDENCY_SERVICES: 'mongodb'
  MONGODB_CONTAINER: 'mongodb'
  MONGODB_PORT: '27017'
  JAVA_VERSION: '25'
  MAVEN_OPTS: '-Xmx3g -XX:+UseG1GC'

jobs:
  nightly-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Environment
        id: setup
        if: success()
        uses: ./.github/actions/setup-environment
        with:
          java_version: ${{ env.JAVA_VERSION }}

      - name: Verify Dependencies
        id: deps
        if: success()
        uses: ./.github/actions/verify-dependencies
        with:
          network_name: ${{ env.NETWORK_NAME }}
          compose_file: ${{ env.DOCKER_COMPOSE_FILE }}
          services_to_start: ${{ env.DEPENDENCY_SERVICES }}
          mongodb_container: ${{ env.MONGODB_CONTAINER }}
          mongodb_port: ${{ env.MONGODB_PORT }}
          startup_timeout: '120'
          verify_network_connectivity: 'true'

      - name: Maven Build
        id: build-maven
        if: success()
        uses: ./.github/actions/maven-build
        with:
          skip_tests: 'true'
          timeout_minutes: '15'

      - name: Run Comprehensive Tests
        id: run-tests
        uses: ./.github/actions/run-tests
        with:
          # quality-gate adds the JaCoCo agent + per-module report; the
          # jacoco.check.skip flag keeps the floor OFF (observe-only) because the
          # nightly breadth run does not control which subset it executes.  The
          # 0.20 INSTRUCTION floor stays enforced by pr.yml.
          maven_profiles: 'all-main-modules,all-test-modules,quality-gate'
          maven_args: '-Djacoco.check.skip=true'
          excluded_groups: 'ManualOnly,RequiresAI,E2E,E2ETest' # E2E tests might be flaky in CI, so we run them separately in a different workflow
          run_pulsar_tests: 'true'
          # 75, not 60: this run is a strict superset of ci.yml (which needs 50)
          # plus Slow/TestInfraCheck classes, and the JaCoCo agent adds overhead.
          # A timeout kills the reactor mid-reactor, so the modules that never ran
          # produce no surefire XML at all.
          timeout_minutes: '75'

      - name: Coverage Summary (observe-only)
        id: coverage
        if: always()
        shell: bash
        run: |
          echo "::group::📈 JaCoCo coverage (observe-only: no floor enforced here)"

          mapfile -t csv_files < <(find . -path '*/target/site/jacoco/jacoco.csv' -type f | sort)
          if [ "${#csv_files[@]}" -eq 0 ]; then
            echo "⚠️ No JaCoCo CSV found — is the quality-gate profile active for this run?"
            echo "   Expected: -P...,quality-gate -Djacoco.check.skip=true"
            echo "::endgroup::"
            exit 0
          fi

          printf '%-58s %10s %10s %10s\n' "module" "instr%" "branch%" "line%"
          printf '%-58s %10s %10s %10s\n' \
            "----------------------------------------------------------" "----------" "----------" "----------"

          summary_rows=""
          for csv in "${csv_files[@]}"; do
            module="${csv#./}"
            module="${module%%/target/site/jacoco/jacoco.csv}"
            read -r instr branch line < <(awk -F, '
              NR > 1 { im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9 }
              END {
                ti = im + ic; tb = bm + bc; tl = lm + lc;
                printf "%s %s %s\n",
                  (ti > 0 ? sprintf("%.1f", 100 * ic / ti) : "n/a"),
                  (tb > 0 ? sprintf("%.1f", 100 * bc / tb) : "n/a"),
                  (tl > 0 ? sprintf("%.1f", 100 * lc / tl) : "n/a")
              }' "$csv")
            printf '%-58s %10s %10s %10s\n' "$module" "$instr" "$branch" "$line"
            summary_rows="${summary_rows}| \`${module}\` | ${instr} | ${branch} | ${line} |\n"
          done

          read -r t_instr t_branch t_line < <(awk -F, '
            FNR > 1 { im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9 }
            END {
              ti = im + ic; tb = bm + bc; tl = lm + lc;
              printf "%s %s %s\n",
                (ti > 0 ? sprintf("%.1f", 100 * ic / ti) : "n/a"),
                (tb > 0 ? sprintf("%.1f", 100 * bc / tb) : "n/a"),
                (tl > 0 ? sprintf("%.1f", 100 * lc / tl) : "n/a")
            }' "${csv_files[@]}")
          printf '%-58s %10s %10s %10s\n' "TOTAL (${#csv_files[@]} modules)" "$t_instr" "$t_branch" "$t_line"
          echo ""
          echo "ℹ️ Observe-only: nightly reports coverage, pr.yml enforces the 0.20 instruction floor."
          echo "::endgroup::"

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### JaCoCo coverage (observe-only — no floor enforced)"
              echo ""
              echo "| Module | Instr % | Branch % | Line % |"
              echo "| --- | --- | --- | --- |"
              printf '%b' "$summary_rows"
              echo "| **TOTAL** | **${t_instr}** | **${t_branch}** | **${t_line}** |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check Test Status
        id: test-check
        if: always()
        shell: bash
        run: |
          echo "::group::🧪 Test Status Report"

          # ── Gather outputs with fallbacks ──
          TEST_STATUS="${{ steps.run-tests.outputs.test_status }}"
          TEST_COUNT="${{ steps.run-tests.outputs.test_count }}"
          FAILED_COUNT="${{ steps.run-tests.outputs.failed_count }}"
          PASSED_COUNT="${{ steps.run-tests.outputs.passed_count }}"
          SKIPPED_COUNT="${{ steps.run-tests.outputs.skipped_count }}"
          FAILED_LIST="${{ steps.run-tests.outputs.failed_test_list }}"

          # Default empty values
          TEST_STATUS="${TEST_STATUS:-skipped}"
          TEST_COUNT="${TEST_COUNT:-0}"
          FAILED_COUNT="${FAILED_COUNT:-0}"
          PASSED_COUNT="${PASSED_COUNT:-0}"
          SKIPPED_COUNT="${SKIPPED_COUNT:-0}"

          # ── Determine outcome ──
          if [ "$TEST_STATUS" = "success" ]; then
            echo "✅ All tests passed successfully"
            echo ""
            echo "📊 Test Summary:"
            echo "  • Total:   ${TEST_COUNT}"
            echo "  • Passed:  ${PASSED_COUNT}"
            echo "  • Skipped: ${SKIPPED_COUNT}"
            echo ""
            echo "📦 Test Reports: test-reports-${{ github.run_id }} (artifact)"
            echo "::endgroup::"
            echo "MAVEN_TESTS_FAILED=0" >> "$GITHUB_ENV"
            exit 0
          fi

          # ── Failure / skipped path ──
          echo "❌ Tests completed with failures"
          echo ""
          echo "┌─────────────────────────────────────────────┐"
          echo "│           TEST FAILURE REPORT               │"
          echo "├─────────────────────────────────────────────┤"
          echo "│ Status:  ${TEST_STATUS}                              │"
          echo "│ Total:   ${TEST_COUNT}                              │"
          echo "│ Passed:  ${PASSED_COUNT}                              │"
          echo "│ Failed:  ${FAILED_COUNT}                              │"
          echo "│ Skipped: ${SKIPPED_COUNT}                              │"
          echo "└─────────────────────────────────────────────┘"
          echo ""

          # ── List failed test classes ──
          if [ -n "${FAILED_LIST}" ] && [ "${FAILED_LIST}" != " " ]; then
            echo "🔴 Failed Test Classes:"
            echo "───────────────────────────────────────────────"
            # FAILED_LIST is space-separated; print one per line
            for test_class in ${FAILED_LIST}; do
              # Trim whitespace
              test_class=$(echo "$test_class" | xargs)
              if [ -n "$test_class" ]; then
                echo "  ✗ ${test_class}"
              fi
            done
            echo "───────────────────────────────────────────────"
          else
            echo "⚠️  No individual failed test names captured."
            echo "   Check the 'Run Comprehensive Tests' step logs for details."
          fi

          echo ""
          echo "📦 Full test reports available in artifact:"
          echo "   Name: test-reports-${{ github.run_id }}"
          echo "   URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""

          # ── Diagnostics: show a sample of failures from Surefire XML ──
          echo "::group::🔍 Failure Details (first 3)"

          FAILURE_COUNT=0
          while IFS= read -r -d '' xml_file; do
            if [ $FAILURE_COUNT -ge 3 ]; then break; fi
            test_class=$(basename "$xml_file" .xml | sed 's/TEST-//')

            # Extract failure/error messages (if any)
            HAS_FAILURE=$(grep -c '<failure ' "$xml_file" 2>/dev/null || echo 0)
            HAS_ERROR=$(grep -c '<error ' "$xml_file" 2>/dev/null || echo 0)

            if [ "$HAS_FAILURE" -gt 0 ] || [ "$HAS_ERROR" -gt 0 ]; then
              FAILURE_COUNT=$((FAILURE_COUNT + 1))
              echo ""
              echo "── ${test_class} ──"

              # Print first failure message (trimmed)
              grep -m1 '<failure ' "$xml_file" 2>/dev/null | head -1 | sed 's/<[^>]*>//g' | cut -c1-300 || true
              grep -m1 '<error ' "$xml_file" 2>/dev/null | head -1 | sed 's/<[^>]*>//g' | cut -c1-300 || true
            fi
          done < <(find . -name "TEST-*.xml" -type f -print0 2>/dev/null)

          echo "::endgroup::"

          echo "::endgroup::"  # closes Test Status Report group

          # Do NOT fail the job here.  The JVM suite and the CLI e2e suite are
          # independent: failing here would skip the Docker build, the app
          # startup and all 204 CLI scenarios whenever a single JVM test fails,
          # so a nightly could never report what actually broke.  Record the
          # state and let the final 'Enforce Nightly Gate' step turn the job red
          # after both sides have run.
          echo "MAVEN_TESTS_FAILED=1" >> "$GITHUB_ENV"
          echo "⚠️  Maven test stage failed — continuing so the CLI e2e stage can run."
          echo "    The job will be failed by the 'Enforce Nightly Gate' step."

      - name: Cleanup Docker system to free space
        run: |
          docker system prune -af
          docker volume prune -f
          rm -rf ~/.m2/repository  # If you no longer need Maven cache
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo df -h

      - name: Build Docker Image
        id: build
        if: success()
        uses: ./.github/actions/docker-build
        with:
          image_name: ${{ env.IMAGE_NAME }}
          version: ${{ github.sha }}
          timeout_minutes: '20'

      - name: Start Application
        id: app
        if: success()
        uses: ./.github/actions/start-application
        with:
          image_name: ${{ env.IMAGE_NAME }}
          version: ${{ github.sha }}
          container_name: ${{ env.CONTAINER_NAME }}
          network_name: ${{ env.NETWORK_NAME }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          proxy_rotation_url: ${{ secrets.PROXY_ROTATION_URL }}

      - name: Health Check
        id: health
        if: success()
        uses: ./.github/actions/health-check
        with:
          service_port: '18182'
          timeout_minutes: '5'
          container_name: ${{ env.CONTAINER_NAME }}

      - name: Setup Rust Toolchain
        id: rust-setup
        # The Rust stages need only the checked-out sources — not Docker, the
        # image or the running app — so they run even when an earlier stage
        # failed.  Keeping them behind success() would let one broken stage
        # hide the CLI test result for the whole night.
        if: ${{ !cancelled() }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        if: ${{ !cancelled() }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli/browser4-cli

      - name: Run browser4-cli unit tests
        id: unit-tests-cli
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: bash
        run: |
          echo "::group::🧪 browser4-cli unit tests (cargo test --bin/--lib)"
          # Every other workflow only builds the `e2e` test target, so the unit
          # tests inside src/ (1400+ #[test] / #[tokio::test] functions) never ran
          # anywhere in CI.  They need no backend, no Docker and no browser.
          cd cli/browser4-cli
          cargo test --bin browser4-cli --lib -- --nocapture
          cd "$(git rev-parse --show-toplevel)"
          echo "::endgroup::"

      - name: Run browser4-cli E2E Tests
        id: e2e-cli
        if: success()
        # 30 minutes, not 15: the same suite gets 30 min in nightly-cli.yml, and a
        # timeout kills cargo mid-suite so the remaining scenarios report nothing.
        timeout-minutes: 30
        shell: bash
        env:
          BROWSER4_E2E_SERVICE_URL: http://localhost:18182
          BROWSER4_E2E_FIXTURE_HOST: host.docker.internal
        run: |
          echo "::group::🧪 browser4-cli E2E Tests"

          # Run the CLI tests against the already-running Docker container.
          # --max-failures=0: nightly is a report, not a merge gate — a tolerated
          # failure here hides damage for a whole day.
          echo "Running browser4-cli E2E tests..."
          echo "Working directory: $(pwd)"
          cd cli/browser4-cli
          cargo test --test e2e -- --nocapture --level=EXTENDED --enable-all --max-failures=0
          cd "$(git rev-parse --show-toplevel)"

          echo "::endgroup::"

      - name: Pipeline Summary
        if: always()
        shell: bash
        run: |
          echo "::group::📊 Pipeline Summary"

          # Helper to map outcome to icon
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⚠️" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❓" ;;
            esac
          }

          echo "╔══════════════════════════════════════════════╗"
          echo "║         NIGHTLY BUILD RESULTS               ║"
          echo "╠══════════════════════════════════════════════╣"

          echo "║                                              ║"
          printf "║  %s %-40s ║\n" "$(icon '${{ steps.setup.outcome }}')" "Setup Environment"
          printf "║  %s %-40s ║\n" "$(icon '${{ steps.deps.outcome }}')" "Verify Dependencies"
          printf "║  %s %-40s ║\n" "$(icon '${{ steps.build-maven.outcome }}')" "Maven Build"
          printf "║  %s %-40s ║\n" "$(icon '${{ steps.run-tests.outcome }}')" "Unit Tests"
          printf "║  %s %-40s ║\n" "$(icon '${{ steps.build.outcome }}')" "Docker Build"
          printf "║  %s %-40s ║\n" "$(icon '${{ steps.app.outcome }}')" "Start Application"
          printf "║  %s %-40s ║\n" "$(icon '${{ steps.health.outcome }}')" "Health Check"

          # Only show CLI stages if they ran (both have success() conditions)
          UNIT_OUTCOME="${{ steps.unit-tests-cli.outcome }}"
          if [ -n "${UNIT_OUTCOME}" ]; then
            printf "║  %s %-40s ║\n" "$(icon "${UNIT_OUTCOME}")" "CLI Unit Tests"
          fi
          E2E_OUTCOME="${{ steps.e2e-cli.outcome }}"
          if [ -n "${E2E_OUTCOME}" ]; then
            printf "║  %s %-40s ║\n" "$(icon "${E2E_OUTCOME}")" "CLI E2E Tests"
          fi

          echo "║                                              ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  Test Details:                               ║"
          # Set by 'Check Test Status': 0 = passed, 1 = failed, unset = never ran.
          # The job outcome is decided by 'Enforce Nightly Gate', not here.
          printf "║  %-42s ║\n" "Maven test stage: ${MAVEN_TESTS_FAILED:-unset}"

          TC="${{ steps.run-tests.outputs.test_count }}"
          FC="${{ steps.run-tests.outputs.failed_count }}"
          PC="${{ steps.run-tests.outputs.passed_count }}"
          SC="${{ steps.run-tests.outputs.skipped_count }}"
          printf "║  Tests: %-4s | Passed: %-4s | Failed: %-4s | Skip: %-4s ║\n" \
            "${TC:-?}" "${PC:-?}" "${FC:-?}" "${SC:-?}"

          # Show failed test classes if any
          FAILED_LIST="${{ steps.run-tests.outputs.failed_test_list }}"
          if [ -n "${FAILED_LIST}" ] && [ "${FAILED_LIST}" != " " ]; then
            echo "║                                              ║"
            echo "║  Failed Classes:                             ║"
            for test_class in ${FAILED_LIST}; do
              test_class=$(echo "$test_class" | xargs)
              if [ -n "$test_class" ]; then
                printf "║    ✗ %-38s ║\n" "${test_class:0:38}"
              fi
            done
          fi

          echo "╚══════════════════════════════════════════════╝"

          echo ""
          echo "🌐 Infrastructure:"
          echo "  - Network:    ${{ env.NETWORK_NAME }}"
          echo "  - Container:  ${{ env.CONTAINER_NAME }}"
          echo "  - Image:      ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "  - MongoDB:    ${{ steps.deps.outputs.mongodb_status || 'unknown' }}"
          echo "  - Redis:      ${{ steps.deps.outputs.redis_status || 'unknown' }}"

          echo ""
          echo "📅 Completed at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo "🔗 Run URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "::endgroup::"

      - name: Enforce Nightly Gate
        # Runs after every stage so one night produces a complete report: the JVM
        # suite, its coverage table and the CLI e2e suite all execute even when an
        # earlier stage failed.  This step alone decides the job outcome.
        if: always()
        shell: bash
        run: |
          echo "::group::🚦 Nightly Gate"

          failed=0

          maven_status="${MAVEN_TESTS_FAILED:-unset}"
          echo "  - Maven test stage : ${maven_status}"
          case "$maven_status" in
            0) echo "      ✅ JVM tests passed" ;;
            1) echo "      ❌ JVM tests failed (see 'Check Test Status' above)"; failed=1 ;;
            *) echo "      ❌ JVM tests never reported a status (setup/build/dependencies failed first)"; failed=1 ;;
          esac

          unit_outcome="${{ steps.unit-tests-cli.outcome }}"
          echo "  - CLI unit tests   : ${unit_outcome:-<not run>}"
          if [ "${unit_outcome:-skipped}" != "success" ]; then
            echo "      ❌ cargo test --bin/--lib did not pass"
            failed=1
          fi

          e2e_outcome="${{ steps.e2e-cli.outcome }}"
          echo "  - CLI e2e tests    : ${e2e_outcome:-<not run>}"
          if [ "${e2e_outcome:-skipped}" != "success" ]; then
            echo "      ❌ browser4-cli e2e did not pass (tolerance is 0 in nightly)"
            failed=1
          fi

          echo "  - Coverage         : observe-only (see 'Coverage Summary')"
          echo "::endgroup::"

          if [ "$failed" -ne 0 ]; then
            echo "❌ Nightly gate failed — see the per-stage summaries above."
            exit 1
          fi
          echo "✅ Nightly gate passed"

      - name: Cleanup Resources
        if: always()
        uses: ./.github/actions/cleanup-resources
        with:
          container_name: ${{ env.CONTAINER_NAME }}
          cleanup_compose: 'true'
          cleanup_volumes: 'true'
          network_name: ${{ env.NETWORK_NAME }}
