name: Setup Environment
description: Setup Java, Maven, and basic dependencies for CI/CD pipeline
author: platonai
branding:
  icon: 'settings'
  color: 'blue'

inputs:
  java_version:
    description: 'Java version to use (default: 17)'
    required: false
    default: '17'
  enable_cache:
    description: 'Enable Maven cache (default: true)'
    required: false
    default: 'true'

outputs:
  java_version:
    description: 'Java version that was installed'
    value: ${{ inputs.java_version }}
  version:
    description: 'Application version from VERSION file'
    value: ${{ env.VERSION }}

runs:
  using: "composite"
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java_version }}
        cache: ${{ inputs.enable_cache == 'true' && 'maven' || '' }}

    - name: Install Required Tools
      shell: pwsh
      run: |
        Write-Host "::group::Installing Required Tools"

        function Test-CommandAvailable([string]$Name) {
          return $null -ne (Get-Command $Name -ErrorAction SilentlyContinue)
        }

        function Install-WithApt([string[]]$Packages) {
          & sudo apt-get update -qq
          if ($LASTEXITCODE -ne 0) {
            throw "apt-get update failed with exit code $LASTEXITCODE"
          }
          & sudo apt-get install -y @Packages
          if ($LASTEXITCODE -ne 0) {
            throw "apt-get install failed with exit code $LASTEXITCODE"
          }
        }

        function Install-WithBrew([string[]]$Packages) {
          & brew install @Packages
          if ($LASTEXITCODE -ne 0) {
            throw "brew install failed with exit code $LASTEXITCODE"
          }
        }

        function Install-WithChoco([string[]]$Packages) {
          & choco install -y --no-progress @Packages
          if ($LASTEXITCODE -ne 0) {
            throw "choco install failed with exit code $LASTEXITCODE"
          }
        }

        if (Test-CommandAvailable 'jq') {
          $jqVersion = & jq --version
          Write-Host "✅ jq already installed: $jqVersion"
        }
        elseif ($IsLinux) {
          Write-Host 'Installing jq with apt-get...' -ForegroundColor Cyan
          Install-WithApt @('jq')
        }
        elseif ($IsMacOS) {
          if (Test-CommandAvailable 'brew') {
            Write-Host 'Installing jq with Homebrew...' -ForegroundColor Cyan
            Install-WithBrew @('jq')
          }
          else {
            Write-Warning 'jq is not installed and Homebrew is unavailable; continuing without automatic jq installation.'
          }
        }
        elseif ($IsWindows) {
          if (Test-CommandAvailable 'choco') {
            Write-Host 'Installing jq with Chocolatey...' -ForegroundColor Cyan
            Install-WithChoco @('jq')
          }
          else {
            Write-Warning 'jq is not installed and Chocolatey is unavailable; continuing without automatic jq installation.'
          }
        }

        if ((Test-CommandAvailable 'timeout') -or (Test-CommandAvailable 'gtimeout')) {
          Write-Host '✅ timeout-compatible command available'
        }
        elseif ($IsLinux) {
          Write-Host 'Installing coreutils with apt-get...' -ForegroundColor Cyan
          Install-WithApt @('coreutils')
        }
        elseif ($IsMacOS) {
          if (Test-CommandAvailable 'brew') {
            Write-Host 'Installing coreutils with Homebrew...' -ForegroundColor Cyan
            Install-WithBrew @('coreutils')
          }
          else {
            Write-Warning 'timeout/gtimeout is not installed and Homebrew is unavailable; continuing without automatic coreutils installation.'
          }
        }
        elseif ($IsWindows) {
          Write-Host 'ℹ️ Skipping timeout installation on Windows; GNU timeout is not required by this setup step.'
        }

        Write-Host "::endgroup::"

    - name: Read Application Version
      shell: bash
      run: |
        echo "::group::Reading Application Version"

        if [ -f VERSION ]; then
          VERSION=$(head -n 1 VERSION | tr -d '\n\r\t ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "✅ Found VERSION file: $VERSION"
        else
          # Try to extract version from pom.xml
          if [ -f pom.xml ]; then
            VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/' | tr -d '\n\r\t ')
            if [ -n "$VERSION" ]; then
              echo "VERSION=$VERSION" >> $GITHUB_ENV
              echo "✅ Extracted version from pom.xml: $VERSION"
            else
              echo "⚠️ Could not extract version from pom.xml"
            fi
          else
            echo "⚠️ No VERSION file or pom.xml found"
          fi
        fi

        echo "::endgroup::"

    - name: Cache Maven Dependencies
      if: inputs.enable_cache == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '**/.mvn/wrapper/maven-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Setup Permissions
      shell: pwsh
      run: |
        Write-Host "::group::Setting up Permissions"

        function Set-UnixExecuteBits([string]$RootPath) {
          if (-not (Test-Path -LiteralPath $RootPath -PathType Container)) {
            return
          }

          $scripts = Get-ChildItem -LiteralPath $RootPath -Recurse -File -Filter '*.sh'
          foreach ($script in $scripts) {
            & chmod +x $script.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "chmod failed for $($script.FullName) with exit code $LASTEXITCODE"
            }
          }

          Write-Host "✅ Set execute permissions for $($scripts.Count) script(s) in $RootPath"
        }

        if ($IsWindows) {
          Write-Host 'ℹ️ Skipping chmod on Windows runners.'
        }
        else {
          Set-UnixExecuteBits 'bin'
          Set-UnixExecuteBits 'scripts'

          if (Test-Path -LiteralPath './mvnw' -PathType Leaf) {
            & chmod +x ./mvnw
            if ($LASTEXITCODE -ne 0) {
              throw "chmod failed for ./mvnw with exit code $LASTEXITCODE"
            }
            Write-Host '✅ Set execute permissions for Maven wrapper'
          }

          if (Test-Path -LiteralPath './gradlew' -PathType Leaf) {
            & chmod +x ./gradlew
            if ($LASTEXITCODE -ne 0) {
              throw "chmod failed for ./gradlew with exit code $LASTEXITCODE"
            }
            Write-Host '✅ Set execute permissions for Gradle wrapper'
          }
        }

        Write-Host "::endgroup::"

    - name: Display Environment Info
      shell: pwsh
      run: |
        Write-Host "::group::Environment Information"

        $javaVersionLine = (& java -version 2>&1 | Select-Object -First 1)
        Write-Host "🔧 Java Version: $javaVersionLine"

        if (Test-Path -LiteralPath './mvnw' -PathType Leaf) {
          $mavenVersionLine = (& ./mvnw --version 2>&1 | Select-Object -First 1)
        }
        elseif (Test-Path -LiteralPath './mvnw.cmd' -PathType Leaf) {
          $mavenVersionLine = (& ./mvnw.cmd --version 2>&1 | Select-Object -First 1)
        }
        else {
          $mavenVersionLine = 'Maven wrapper not found'
        }
        Write-Host "🔧 Maven Version: $mavenVersionLine"

        $dockerVersionLine = if (Get-Command docker -ErrorAction SilentlyContinue) {
          & docker --version 2>&1
        } else {
          'Docker not available'
        }
        Write-Host "🔧 Docker Version: $dockerVersionLine"

        $osDescription = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription.Trim()
        Write-Host "🔧 Operating System: $osDescription"

        $computerSystem = if (Get-Command Get-CimInstance -ErrorAction SilentlyContinue) {
          Get-CimInstance Win32_ComputerSystem -ErrorAction SilentlyContinue
        } else {
          $null
        }
        if ($computerSystem) {
          $totalMemoryGiB = [math]::Round($computerSystem.TotalPhysicalMemory / 1GB, 2)
          Write-Host "🔧 Available Memory: $totalMemoryGiB GiB total"
        }
        else {
          try {
            if ($IsLinux) {
              $memLine = Get-Content -LiteralPath '/proc/meminfo' | Where-Object { $_ -like 'MemTotal:*' } | Select-Object -First 1
              if ($memLine) {
                $memKb = [double](($memLine -split '\s+')[1])
                Write-Host ("🔧 Available Memory: {0} GiB total" -f [math]::Round($memKb / 1MB, 2))
              }
            }
            elseif ($IsMacOS) {
              $memBytes = [double](& sysctl -n hw.memsize)
              Write-Host ("🔧 Available Memory: {0} GiB total" -f [math]::Round($memBytes / 1GB, 2))
            }
          }
          catch {
            Write-Host '🔧 Available Memory: unavailable'
          }
        }

        try {
          $driveName = if ($IsWindows) { (Get-Location).Drive.Name } else { '/' }
          $disk = Get-PSDrive -Name $driveName -ErrorAction Stop
          $freeGiB = [math]::Round($disk.Free / 1GB, 2)
          Write-Host "🔧 Available Disk: $freeGiB GiB free on $driveName"
        }
        catch {
          Write-Host '🔧 Available Disk: unavailable'
        }

        Write-Host "::endgroup::"
