name: 'Create Release Notes'
description: 'Generate comprehensive release notes'
inputs:
  version:
    description: 'Release version'
    required: true
  jar_name:
    description: 'JAR file name'
    required: true
  jar_path:
    description: 'JAR file path'
    required: true
  java_version:
    description: 'Java version requirement'
    required: true
  output_file:
    description: 'Output file name'
    required: true
    default: 'release_notes.md'

runs:
  using: 'composite'
  steps:
    - name: Generate Release Notes
      shell: bash
      run: |
        echo "📝 Generating release notes..."

        # Get previous tag for changelog
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

        # Get JAR size
        JAR_SIZE=$(stat -c%s "${{ inputs.jar_path }}" 2>/dev/null || echo 0)
        JAR_SIZE_HUMAN=$(numfmt --to=iec --suffix=B $JAR_SIZE)

        # Get commit count and contributors
        if [ -n "$PREV_TAG" ]; then
          COMMIT_COUNT=$(git rev-list --count "$PREV_TAG"..HEAD 2>/dev/null || echo "0")
          CHANGELOG=$(git log --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" "$PREV_TAG"..HEAD)
          CHANGELOG_LINK="[${PREV_TAG}...v${{ inputs.version }}](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${{ inputs.version }})"
        else
          COMMIT_COUNT=$(git rev-list --count HEAD~10..HEAD 2>/dev/null || echo "0")
          CHANGELOG=$(git log --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" HEAD~10..HEAD)
          CHANGELOG_LINK="Initial release"
        fi

        CONTRIBUTOR_COUNT=$(git shortlog -sn ${PREV_TAG:+$PREV_TAG..}HEAD | wc -l)
        BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

        # Create release notes
        cat > ${{ inputs.output_file }} << EOF
        # 🚀 Browser4 v${{ inputs.version }} Release Notes

        **Release Date:** $BUILD_DATE
        **Java Version:** ${{ inputs.java_version }}
        **Built by:** @${{ github.actor }}

        ---

        ## 📦 Release Highlights

        ### 📊 Release Statistics
        | Metric | Value |
        |--------|-------|
        | 📁 **JAR Size** | $JAR_SIZE_HUMAN |
        | 📝 **Commits** | $COMMIT_COUNT |
        | 👥 **Contributors** | $CONTRIBUTOR_COUNT |
        | 🏗️ **Build Date** | $BUILD_DATE |

        ### 🔄 Changes Since Last Release
        $CHANGELOG

        ---

        ## 🚀 Quick Start

        ### Self-contained install

        Use the CLI to download the matching Browser4 runtime bundle for your platform:

        ```shell
        browser4-cli install
        browser4-cli open
        ```

        ### CLI & SKILLS

        ```shell
        # Open a new browser window
        browser4-cli open

        # Navigate to a page
        browser4-cli goto https://browser4.io

        # Inspect the page — note the eN labels on interactive nodes
        browser4-cli snapshot

        # Interact using refs from the snapshot
        browser4-cli click e15
        browser4-cli type e15 "Hello World"
        browser4-cli press e15 Enter
        browser4-cli keydown Shift
        browser4-cli mousemove 150 300
        browser4-cli mousewheel 0 100
        browser4-cli keyup Shift

        # Take a screenshot and save it to disk
        browser4-cli screenshot

        # Use a custom server URL
        browser4-cli open --server http://localhost:9090

        # Execute multiple commands in one process
        browser4-cli batch "open https://browser4.io" "snapshot"

        # Stop on the first batch failure
        browser4-cli batch --bail "open https://browser4.io" "click e1" "screenshot"

        # Advanced: pipe batch commands as JSON via stdin
        echo '[
          ["goto", "https://example.com/form-filling"],
          ["click", "#reset-btn"],
          ["fill", "#first-name", "Bob"],
          ["fill", "#last-name", "Smith"],
          ["fill", "#email", "bob@example.com"],
          ["select", "#country", "uk"],
          ["check", "#agree-terms"],
          ["click", "#submit-btn"]
        ]' | browser4-cli batch --json

        # Close the session when done
        browser4-cli close
        ```

        ---

        ## 📄 Full Changelog
        $CHANGELOG_LINK

        ---

        *Built with ❤️ by the Browser4 team*
        EOF

        echo "✅ Release notes generated: ${{ inputs.output_file }}"
